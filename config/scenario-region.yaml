# A regional posting: Vienna, Berlin and Trieste in 1953.
#
# The shipped game stays `config/scenario.yaml` (the single-city slice). Start
# this one with:
#
#   pnpm play --scenario config/scenario-region.yaml
#
# Ambient city life is on for this posting. Plot selection stays off.
# The shipped scenario does not load either.

difficulty:
  preset: standard
  overrides: {}

mole: false

ambient:
  enabled: true
  density: standard

region:
  template: central-1953
  stationModel: regional

packs:
  dirs:
    - packages/content/packs/core
    - packages/content/packs/era-cold-war-early
    - packages/content/packs/lib-central-europe
    - packages/content/packs/lib-russian
    - packages/content/packs/lib-eastern-mediterranean
    - packages/content/packs/lib-western
    - packages/content/packs/city-vienna
    - packages/content/packs/city-berlin
    - packages/content/packs/city-trieste
    - packages/content/packs/region-core
    - packages/content/packs/ambient
  load:
    - core
    - era-cold-war-early
    - lib-central-europe
    - lib-russian
    - lib-eastern-mediterranean
    - lib-western
    - city-vienna
    - city-berlin
    - city-trieste
    - region-core
    - ambient

narration: full

recruitment:
  pitch:
    w1: 2.2
    w2: 1.4
    w3: 1.8
    w4: 1.2
  firstContact:
    a: 1.5
    b: 1.0
    c: 1.2
    d: 0.8
  meeting:
    trust: 1.6
    riskAversion: 1.3
    scheduleConflict: 1.0
    agendaInterest: 1.1
  exposure:
    k1: 0.6
    k2: 0.4
    k3: 0.3
  turn:
    w1: 1.8
    w2: 1.3
    w3: 1.5
    w4: 1.0
    w5: 0.9

retries:
  leakGuard: 2
  narrator: 1
  refusal: 1
  extraction: 1
  timeout: 1

tokenBudget: 3000

custodyPhases: 4
silenceDays: 3
interceptRetentionDays: 2

metrics:
  enabled: true
  path: logs/metrics.jsonl
