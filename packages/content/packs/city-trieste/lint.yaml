# lint.yaml — Pack Linter Suppressions for city-trieste (content-expansion 9.10).
#
# A pack's lint.yaml is a list of Suppressions, each { rule, path, justification }
# where `rule` is a suppressible Lint Rule id, `path` is the exact located
# finding path to silence, and `justification` is a non-empty reason recorded in
# the report (design, "Pack Linter"; Req 13.5, 13.6). A Suppression naming a
# non-suppressible rule (CE-SCHEMA, CE-REF, CE-REALPERSON, CE-SENSITIVE,
# CE-PROVENANCE, CE-QUANTITY, CE-VARIANT, CE-CONFORM, CE-FEASIBLE, CE-IDSTABLE)
# is rejected with a CE-SCHEMA error, so none is listed here.
#
# The institutions and voice authored by task 9.10 (the newspapers, local
# organisations, the local-security Service, Cover Identities, the Locale, the
# article Document templates, the Rumour templates and the Template Variants)
# lint clean under the release profile: every reference resolves, every variant
# slot set matches its base, the Quantity Targets are met, and no authored name,
# term or passage trips the identity, period or style rules.
#
# The entries below are the ONLY findings on the pack, and all fall on the
# geography half (task 9.9): CE-DUPTEXT on the short, tag-like `atmosphere`
# words that recur across the city's Locations and Districts, and CE-DUPTEXT /
# CE-NEARDUP on the Location-Type description pools the city deliberately shares
# with the slice's core venue prose. These repetitions carry no new information
# and are intentional period texture, so they are suppressible warnings and are
# downgraded to informational here with a justification, leaving the pack with
# no active error or warning finding under the release profile.
