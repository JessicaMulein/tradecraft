# locations.yaml — the authored Locations of Trieste, 1947–1954
# (content-expansion task 9.9).
#
# Each is a CityLocation (CityLocationSchema): a place pinned to a District and
# stamped from a city Location Type (bare `type` refs namespace to this pack,
# e.g. `kaffeehaus` -> `city-trieste/kaffeehaus`). The city's café, park, port,
# embassy and tram Location Types carry the slice's generic bare ids
# (`kaffeehaus`, `park`, `danube-port`, `embassy`, `tram-stop`) so the core Plot
# Templates — which key their traces on those Location-Type ids — bind to the
# city's own Locations. It carries its own Tags, a `basis`
# (real-landmark | real-inspired | fictional) that drives the Sources
# requirement, an optional Year Range, the `sources` that attest a real
# landmark, and an optional weighted-fill `weight`.
#
# A Location's Effective Tags are its own Tags together with its Location Type's
# Tags; Tag Conformance counts binders among these (Req 4.5). The set below
# spreads ≥25 Locations across all seven Districts and carries, with margin,
# every core Required Query the generator must bind in the city: the Station
# office, public meeting spots, dead-drop sites, newspaper outlets, transit
# hubs, a materiel store, a diplomatic setting, private places, and one of every
# Location function the archetype schedules draw on.
#
# Real landmarks (the Molo Audace, the Canal Grande, Piazza Unità, the castle of
# San Giusto, the Stazione Centrale, the Opicina tramway, the free-port
# warehouses) are named as period texture and cited in sources.yaml. Every
# business, firm, office and name attached to them is fictional.

# =========================================================================
# BORGO TERESIANO (Zone A) — the Teresian grid and the Canal Grande
# =========================================================================

