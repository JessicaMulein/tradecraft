# streets.yaml — the street-name and name-entity pools of Trieste
# (content-expansion task 9.9).
#
# Each pool is a StreetsPool (`{ id, names }`). The generator draws addresses
# from the street pools, and Location Type `namePatterns` draw entity names via
# `{pick:<pool>}`. The street names are real streets, squares and quays of
# Trieste and its hinterland (period texture, cited collectively in
# sources.yaml); the entity names (cafés, hotels, firms) are fictional.
#
# The street pools below carry well over sixty distinct Triestine street names
# across the quarters (Req: ≥60 streets).

# --- Street-name pools (the ≥60 streets) -----------------------------------

