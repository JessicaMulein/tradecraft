# location-types.yaml — the Location Types the Trieste generator stamps
# (content-expansion task 9.9).
#
# City-Scoped slice Location Types (LocationTypeSchema, packages/content/src/lib
# /kinds.ts): ordinary slice Location Types that live in the City Pack, so they
# are owned by this city. Each fixes whether its Locations are public, the
# actions it allows, its weekly hours and crowd curve, how weather bends the
# crowd, the base risk of being there, whether it can hold a dead drop, the name
# patterns the generator stamps anonymous instances from (drawing on
# streets.yaml pools via `{pick:<pool>}`), and the description and atmosphere
# pools.
#
# A Location Type's `tags` are the Effective Tags its Locations inherit (a
# Location's Effective Tags are its own Tags together with its type's Tags), so
# the function/venue/access Tags here are what carries Tag Conformance for the
# city (Req 4.3–4.5). Every function the core Required Queries name is covered
# by at least one type below.
#
# Period: the Free Territory of Trieste, 1947–1954. Everything is of its time —
# trams, steam railways, telegraph, coal smoke, newspapers, coffee and the
# Adriatic shipping trade. No anachronism. Action ids follow the slice Action
# union (travel is the arrival action, allowed everywhere; confront and
# turn-agent ride inside a talk scene).
#
# Phases, in order: early-morning, morning, midday, afternoon, evening, night,
# late-night, dead-of-night.

# --- 1. Caffè (Viennese-style coffee house) --------------------------------
# Bare id `kaffeehaus` so the slice's core Plot Templates, which key their
# café traces on the Location-Type id `kaffeehaus`, bind to the city's cafés
# (the generator groups public Locations by their bare Location-Type id).
- id: kaffeehaus
  public: true
  allowedActions: [travel, talk, approach, confront, turn-agent, surveil, follow, arrange-meeting, read, wait]
  openingHours:
    - { weekday: monday, openPhase: early-morning, closePhase: night }
    - { weekday: tuesday, openPhase: early-morning, closePhase: night }
    - { weekday: wednesday, openPhase: early-morning, closePhase: night }
    - { weekday: thursday, openPhase: early-morning, closePhase: night }
    - { weekday: friday, openPhase: early-morning, closePhase: late-night }
    - { weekday: saturday, openPhase: early-morning, closePhase: late-night }
    - { weekday: sunday, openPhase: morning, closePhase: night }
  crowdCurve:
    - { weekday: monday, phase: morning, level: 0.5 }
    - { weekday: monday, phase: midday, level: 0.7 }
    - { weekday: monday, phase: afternoon, level: 0.75 }
    - { weekday: saturday, phase: afternoon, level: 0.9 }
    - { weekday: sunday, phase: afternoon, level: 0.8 }
  weatherModifiers:
    - { weather: rain, crowdMultiplier: 1.2 }
    - { weather: bora, crowdMultiplier: 1.3 }
    - { weather: clear, crowdMultiplier: 0.9 }
  baseRisk: 0.15
  allowsDeadDrops: false
  namePatterns:
    - '{pick:cafe-names}'
  descriptionPool:
    - A high room of marble tables and bentwood chairs, the brass machine hissing and the day's papers on their wooden wands.
    - Mirrored walls and a smell of roasted coffee; a waiter in a white jacket brings water on a little tray and leaves you to your paper.
    - Shipping men and clerks hold the window tables where the light comes off the water; the talk runs in three languages at once.
    - A quiet corner where a man can sit over one small black coffee for a whole afternoon and no one will move him on.
    - Old men play cards under a yellowed ceiling while the trams clang past the steamed-up glass.
  atmosphereTags: [smoky, genteel, unhurried, public]
  tags: [venue:cafe, function:cafe, function:meeting-spot, access:public]

