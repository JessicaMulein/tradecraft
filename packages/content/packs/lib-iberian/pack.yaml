# The lib-iberian Library Pack manifest (content-expansion task 8.2).
#
# A Library Pack supplies the shared `culture-group` records (each a Name Pool,
# Naming Rule, voice traits, mannerisms and Year-ranged persona backgrounds) the
# World Generator draws NPC names, voices and cover biographies from (Req 6.1,
# 7.1). It is not City-Scoped: a City Pack's Culture Weights reference these
# groups by their namespaced id (e.g. `lib-iberian/portuguese`).
#
# This pack covers the Iberian groups of the early Cold War: Portuguese and
# Spanish. They populate the Lisbon City Pack and the shipping, émigré and
# diplomatic communities of the neutral capitals (task 9). Both traditions carry
# TWO surnames, so each group's Naming Rule turns on `parts.family2: true` and
# its display pattern renders `{given} {family} {family2}`; the generator draws
# the second surname from the same family pool (engine `nameNpc`, design
# NamingRule). Iberian surnames are generally invariant in form, so the family
# names here are plain strings (not gendered pairs).
#
# Every name here is a generic, common period name of its culture in a
# FICTIONAL combination; none names a real individual, and famous full-name
# combinations are avoided (cross-checked against the era Real-Person Blocklist,
# Req 3.3, 11.4).
#
# It declares `role: library` and `contentSchema: 2`, and requires only the core
# pack (the Tag Vocabulary and slice kinds). The loader merges it with any Era
# and City Packs a scenario loads (tasks 2.1, 2.4).
id: lib-iberian
version: 1.0.0
contentSchema: 2
role: library
requires:
  - id: core
    range: '^1.0.0'
overrides: []
