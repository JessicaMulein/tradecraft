  voiceTraits:
    - courteous and reserved, slow to show the hand
    - carries a melancholy under the politeness
    - speaks of the regime only in the mildest terms
    - warms over a shared table and strong coffee
    - closes a hard subject with a quiet fatalism
  mannerisms:
    - stirs the coffee long after the sugar is gone
    - defers to age and title without being asked
    - lowers the voice when a uniform is near
    - keeps the hat in hand indoors out of old habit
    - sees a guest to the stairs and no further
  backgrounds:
    - text: Clerks at the port authority and knows which ships leave the manifests short.
      tags: []
    - text: Keeps a pensão near the river where refugees wait for a passage out.
      tags: []
      years: { from: 1945, to: 1955 }
    - text: Works for a shipping agent and reads the sailings before the papers print them.
      tags: []
    - text: Teaches at a lycée and measures each word against who might be listening.
      tags: []
    - text: Keeps the accounts for a wine exporter and the exporter's quiet partners.
      tags: []
    - text: Drives a hired car for the legations and recalls every street and passenger.
      tags: []
    - text: Came from the Alentejo for work and never lost the country reserve.
      tags: []
    - text: Tends the desk at a hotel the right people pass through on their way elsewhere.
      tags: []
    - text: Repairs wireless sets and asks no questions about the odd request.
      tags: []
    - text: Sorts cables at a telegraph office and notices which addresses recur.
      tags: []
    - text: Buys and sells travel papers in a back office the police tolerate.
      tags: []
      years: { from: 1945, to: 1955 }
    - text: Keeps a fado house in the old quarter where consuls take their late nights.
      tags: []
    - text: Clerks for a diamond buyer and never sees the stones that pass through.
      tags: []
    - text: Runs the ticket desk at the airport and knows who flies out and when.
      tags: []
    - text: Keeps a bookshop near the university that stocks the titles the censor missed.
      tags: []
    - text: Manages a currency bureau on the avenue and reads the market in whispers.
      tags: []
