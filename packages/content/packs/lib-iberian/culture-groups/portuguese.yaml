# culture-groups/portuguese.yaml — the Portuguese group.
#
# A CultureGroup (CultureGroupSchema). Portuguese names carry two surnames
# (traditionally the mother's family name then the father's), so the Naming Rule
# turns on `parts.family2: true` and the display pattern renders
# {given} {family} {family2}; the generator draws the second surname from the
# same family pool (engine `nameNpc`). Portuguese surnames are invariant in
# form, so family names are plain strings (not gendered pairs). Quantity
# (Req 11.4): at least 100 given and 100 family names, at least 300 distinct
# total. All names are generic, common Portuguese names of the period in
# fictional use; none names a real individual.
- id: portuguese
  name: Portuguese
  languages:
    - pt
  naming:
    display: '{given} {family} {family2}'
    formal: '{honorific} {family}'
    parts:
