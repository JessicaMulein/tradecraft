# culture-groups/spanish.yaml — the Spanish group.
#
# A CultureGroup (CultureGroupSchema). Spanish names carry two surnames (the
# father's family name then the mother's), so the Naming Rule turns on
# `parts.family2: true` and the display pattern renders {given} {family} {family2};
# the generator draws the second surname from the same family pool (engine
# `nameNpc`). The formal pattern uses the first (paternal) surname. Spanish
# surnames are invariant in form, so family names are plain strings (not
# gendered pairs). Quantity (Req 11.4): at least 100 given and 100 family names,
# at least 300 distinct total. All names are generic, common Spanish names of
# the period in fictional use; none names a real individual.
- id: spanish
  name: Spanish
  languages:
    - es
  naming:
    display: '{given} {family} {family2}'
    formal: '{honorific} {family}'
    parts:
      family2: true
