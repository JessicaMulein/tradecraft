  voiceTraits:
    - formal and proud, courteous to a careful degree
    - speaks of politics in guarded, roundabout terms
    - warms slowly, then with great loyalty
    - laces conversation with proverb and dry wit
    - defers to rank and the Church out of long habit
  mannerisms:
    - takes a long midday pause no business interrupts
    - greets with a firm handshake and a steady look
    - lowers the voice to name the authorities
    - lets a point rest over a cigarette before pressing it
    - sees a guest to the door with elaborate courtesy
  backgrounds:
    - text: Clerks at a shipping office on the quay and knows the sailings by heart.
      tags: []
    - text: Keeps a pensión in the old town where travellers stay longer than planned.
      tags: []
    - text: Represents an import house and travels on its letterhead across the border.
      tags: []
    - text: Teaches at a seminary school and weighs each word against who might report it.
      tags: []
    - text: Keeps the books for a sherry exporter and the exporter's silent partners.
      tags: []
    - text: Came from the south for work and kept the village wariness of strangers.
      tags: []
    - text: Tends the reception at a hotel the diplomats favour for its discretion.
      tags: []
    - text: Fled north in the war years and settled where no one asks the old questions.
      tags: []
      years: { from: 1945, to: 1960 }
    - text: Repairs motorcars for the legations and overhears more than the engines.
      tags: []
    - text: Works the telegraph counter and marks which names cable one another often.
      tags: []
    - text: Keeps a tobacconist's by the bullring where the touts trade more than tickets.
      tags: []
    - text: Buys olives and almonds for export and travels the border roads freely.
      tags: []
    - text: Runs a boarding house near the port that fills when a ship is delayed.
      tags: []
    - text: Clerks for a bank's foreign desk and sees which transfers never clear.
      tags: []
    - text: Keeps a café by the cathedral where the civil servants take their mornings.
      tags: []
    - text: Guides foreign visitors through the old town and files a note on each.
      tags: []
