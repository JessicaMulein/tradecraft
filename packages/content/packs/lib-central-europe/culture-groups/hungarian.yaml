# culture-groups/hungarian.yaml — the Hungarian group.
#
# A CultureGroup (CultureGroupSchema). Hungarian surnames are not gender-
# inflected, so family names are plain strings. The Naming Rule uses the generic
# {given} {family} display the engine renders; Magyar name order (family first)
# is left to presentation. Quantity (Req 11.4): at least 100 given and 100
# family names, at least 300 distinct total. All names are generic, common
# Hungarian names of the period in fictional use; none names a real individual.
