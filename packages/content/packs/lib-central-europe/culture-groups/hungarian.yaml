  voiceTraits:
    - proud of a long memory, slow to forget a slight
    - formal in address, warm once past the formality
    - fond of toasts and the long way round a point
    - speaks of the old kingdom with wistful pride
    - careful with politics, generous with hospitality
  mannerisms:
    - raises a glass before every serious word
    - presses food and drink on any guest
    - clasps a hand in both of his to greet
    - lapses into a sigh at talk of the past
    - keeps the hat on until the second question
  backgrounds:
    - text: Came to the city for work and kept a room in a boarding house near the market.
      tags: []
    - text: Tended a coffee house kitchen and fed half the quarter on credit through the hard winters.
      tags: []
    - text: Served in the old army and keeps the discipline though the uniform is long gone.
      tags: []
    - text: Fled the countryside when the collectives came and never speaks of the village.
      tags: []
      years: { from: 1949, to: 1965 }
    - text: Clerks at a trading office and knows which ledgers are kept in two hands.
      tags: []
    - text: Plays the violin at weddings and funerals both, and hears every family's quarrel.
      tags: []
    - text: Runs a tobacconist's near the station and trades news as freely as cigarettes.
      tags: []
    - text: Kept the family vineyard until it was taken, and now pours wine for others.
      tags: []
      years: { from: 1949, to: 1965 }
