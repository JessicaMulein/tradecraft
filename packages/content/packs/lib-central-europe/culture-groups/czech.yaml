# family names are gendered pairs { m, f } (Novák / Nováková) — the generator
# picks the form matching the drawn NPC's gender (design, FamilyName). Quantity
# (Req 11.4): at least 100 given and 100 family names, at least 300 distinct
# total. All names are generic, common Czech names of the period in fictional
# use; none names a real individual.
