  voiceTraits:
    - wry and understated, deflecting with a joke
    - careful with strangers, warmer once the ice breaks
    - fond of a proverb for every occasion
    - speaks of authority with studied neutrality
    - switches to German or Russian only when it buys safety
  mannerisms:
    - taps the table twice before making a point
    - keeps a half-finished beer as a reason to linger
    - lowers the eyes when a uniform passes
    - rolls a cigarette with slow deliberation
    - answers obliquely until trust is earned
  backgrounds:
    - text: Grew up in a flat off the old square and watched the regimes come and go.
      tags: []
    - text: Worked the railway yards and learned which freight moved after dark.
      tags: []
    - text: Kept a small workshop going by never asking what the parts were for.
      tags: []
    - text: Lost a brother to the border and speaks of him only to the trusted.
      tags: []
      years: { from: 1948, to: 1965 }
    - text: Teaches at a gymnasium and measures every word against who might report it.
      tags: []
      years: { from: 1948, to: 1965 }
    - text: Tends a wine cellar in the old town and remembers every regular's usual.
      tags: []
    - text: Came to the city from a Moravian village and never lost the country caution.
      tags: []
    - text: Sorts post at the central office and notices which letters never arrive.
      tags: []
