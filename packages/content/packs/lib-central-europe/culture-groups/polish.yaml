# culture-groups/polish.yaml — the Polish group.
#
# A CultureGroup (CultureGroupSchema). Polish adjectival surnames inflect by
# gender (-ski / -ska, -cki / -cka, -dzki / -dzka), so those are gendered pairs
# { m, f }; non-adjectival surnames (Nowak, Kowalczyk) are invariant plain
# strings. The generator picks the form matching the drawn NPC's gender.
# Quantity (Req 11.4): at least 100 given and 100 family names, at least 300
# distinct total. All names are generic, common Polish names of the period in
# fictional use; none names a real individual.
