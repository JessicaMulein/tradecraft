  voiceTraits:
    - courteous and ceremonious, with old-world manners
    - guarded about the authorities, open among friends
    - fond of a long aside and a longer memory
    - speaks of faith and country in the same breath
    - stubborn pride worn lightly until it matters
  mannerisms:
    - kisses a lady's hand in greeting out of old habit
    - crosses himself passing a church
    - keeps the voice down at any mention of the east
    - offers tea before any conversation of weight
    - taps a cigarette twice on the case before lighting
  backgrounds:
    - text: Came west after the war and rebuilt a trade from nothing in a borrowed shop.
      tags: []
      years: { from: 1945, to: 1955 }
    - text: Keeps a tailor's near the market and remembers every customer's measurements.
      tags: []
    - text: Served in the wartime resistance and speaks of those years only to the trusted.
      tags: []
      years: { from: 1945, to: 1960 }
    - text: Works the river docks and knows which barges carry more than their manifests.
      tags: []
    - text: Lost the family estate in the east and carries the deeds that are now worthless.
      tags: []
      years: { from: 1945, to: 1965 }
    - text: Sings in a church choir and hears confessions second-hand through the sacristan.
      tags: []
    - text: Runs a bookbinder's and mends more than books for those who ask quietly.
      tags: []
    - text: Clerked for a shipping agent before the war and still keeps the old ledgers.
      tags: []
