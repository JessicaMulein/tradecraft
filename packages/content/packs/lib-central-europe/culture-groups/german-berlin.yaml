  voiceTraits:
    - clipped and direct, little patience for ceremony
    - a sharp Berlin wit, quick with a sardonic aside
    - speaks of the sectors the way others speak of weather
    - weighs every sentence for who might be listening
    - matter-of-fact about shortage and rubble alike
    - drops into dialect when the guard comes down
  mannerisms:
    - checks the window before answering a question
    - counts out coins twice before paying
    - keeps a cigarette unlit between the fingers
    - names streets by their old pre-war names
    - glances at a watch that no longer keeps time
  backgrounds:
    - text: Cleared rubble in the first years and never quite left the habit of looking down for salvage.
      tags: []
      years: { from: 1948, to: 1955 }
    - text: Keeps a flat in one sector and a job in another, and crosses the line each morning.
      tags: []
      years: { from: 1948, to: 1961 }
    - text: Grew up between the ruins of Mitte and learned which cellars stayed dry.
      tags: []
    - text: Runs a kiosk near an S-Bahn station and hears half the district's gossip by noon.
      tags: []
    - text: Lost touch with family on the far side of the city and stopped writing to be safe.
      tags: []
      years: { from: 1952, to: 1961 }
    - text: Worked the black market when the Reichsmark was worthless and never trusts paper money since.
      tags: []
      years: { from: 1948, to: 1952 }
    - text: Drives a delivery van and knows every checkpoint queue by its guards.
      tags: []
    - text: Plays accordion in a cellar bar and keeps the takings in three different pockets.
      tags: []
