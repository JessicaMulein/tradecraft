  voiceTraits:
    - formal and courteous to a fault
    - fond of the diminutive, softening every noun
    - dry Viennese irony under the politeness
    - circles a subject three times before naming it
    - quick to invoke the way things were done before the war
    - defers with a title where a name would do
  mannerisms:
    - stirs a coffee long after the sugar has dissolved
    - touches the brim of the hat in greeting
    - lowers the voice whenever the occupiers are mentioned
    - taps ash with a small, precise flick
    - answers a question with a proverb
    - folds the newspaper to a quarter before reading
  backgrounds:
    - text: Grew up in Leopoldstadt and never left the district for long.
      tags: []
    - text: Kept the family trade going through the hard years after the war.
      tags: []
    - text: Lost the family flat to the bombing and took rooms in a stranger's house.
      tags: []
      years: { from: 1945, to: 1955 }
    - text: Served in the old administration and learned to say little and notice much.
      tags: []
    - text: Waited out the occupation behind a shop counter, trusting no sector in particular.
      tags: []
      years: { from: 1945, to: 1955 }
    - text: Tends the counter of a coffee house that has stood on the same corner for forty years.
      tags: []
    - text: Returned from a prisoner-of-war camp to find the city divided into quarters.
      tags: []
      years: { from: 1945, to: 1953 }
    - text: Plays second violin in a café orchestra and knows which guests tip and which listen.
      tags: []
