# The lib-central-europe Library Pack manifest (content-expansion task 8.1).
#
# A Library Pack supplies the shared `culture-group` records (each a Name Pool,
# Naming Rule, voice traits, mannerisms and Year-ranged persona backgrounds) the
# World Generator draws NPC names, voices and cover biographies from (Req 6.1,
# 7.1). It is not City-Scoped: a City Pack's Culture Weights reference these
# groups by their namespaced id (e.g. `lib-central-europe/czech`).
#
# This pack covers the Central-European groups of the early Cold War: Austrian
# German (Vienna), German (Berlin), Czech, Hungarian and Polish. The Russian
# group ships separately in `lib-russian` (it needs a patronymic Naming Rule and
# its own gendered family forms). Together the two packs satisfy the Culture
# Weights of the Vienna, Berlin and Trieste City Packs (task 9).
#
# Every name here is a generic, common period name of its culture in a
# FICTIONAL combination; none names a real individual, and famous full-name
# combinations are avoided (cross-checked against the era Real-Person Blocklist,
# Req 3.3, 11.4). The Czech and Polish groups carry gendered family forms where
# the language inflects the surname by gender (Novák / Nováková, -ski / -ska).
#
# It declares `role: library` and `contentSchema: 2`, and requires only the core
# pack (the Tag Vocabulary and slice kinds). The loader merges it with any Era
# and City Packs a scenario loads (tasks 2.1, 2.4).
id: lib-central-europe
version: 1.0.0
contentSchema: 2
role: library
requires:
  - id: core
    range: '^1.0.0'
overrides: []
