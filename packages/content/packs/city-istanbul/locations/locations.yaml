# locations/locations.yaml — the Istanbul City Locations (task 9.5).
#
# Each validates against CityLocationSchema (city.ts): the slice Location fields
# (id, name, aliases?, type, district, public, description, atmosphere?) plus the
# City-Scoped additions (city, tags, basis, years?, sources?, weight?). `type`
# references an Istanbul Location Type by its bare id (the loader namespaces a
# bare reference to this pack, and the setting step keys the city's Location
# Types by their bare id when it merges a Location's Effective Tags, so a bare
# `type` is what lets the city bind the Required Queries); `district` an Istanbul
# District; `sources` entries in this pack's `sources/` bibliography. A
# Location's Effective Tags are its own
# `tags` plus its Location Type's Tags, and those together must let the city
# bind every Required Query the Tag Vocabulary guarantees (design, "Tag
# Conformance"; Req 4.5, 4.6).
#
# `basis` records how the place relates to the real city: `real-landmark` for a
# named real place (which cites a Source), `real-inspired` for a fictional place
# drawn from a real one, `fictional` for a wholly invented place. All real
# landmarks are named for texture only; every business name, proprietor and
# patron in play is fictional, and the prose is original.
#
# Thirty-two Locations spread across all six Districts, with margin over every
# Required Query minimum so the city is feasible for any seed and any Start Date
# in 1950–1965.

# =========================================================================
# BEYOĞLU (Pera) — the cosmopolitan heights
# =========================================================================

- id: cafe-markiz
  name: Café Markiz
  type: core/kaffeehaus
  district: beyoglu
  public: true
  description: >-
    A mirrored patisserie on the Grande Rue, its Art-Nouveau tile panels of the
    four seasons behind the marble counter, where the Pera set take coffee and
    pastries and read the foreign papers at the little round tables.
  atmosphere: [refined and hushed, mirrored, worldly and polyglot]
  city: istanbul
  tags: [function:cafe, function:meeting-spot, access:public]
  basis: real-inspired
  weight: 2

- id: hotel-bar-pera
  name: the long bar at the Pera Palace
  aliases:
    - { text: the Orient Bar, distinctive: true }
  type: core/hotel-bar
  district: beyoglu
  public: true
  description: >-
    The famous hotel above the Golden Horn built for the Orient-Express
    traveller: a long bar of dark wood and brass where correspondents, attachés
    and shipping men hold the stools and the talk runs in four languages, none
    of it quite the truth.
  city: istanbul
  tags: [function:hotel-bar, function:meeting-spot, access:public]
  basis: real-landmark
  sources: [src-pera-palace]
  weight: 2

- id: cinema-emek
  name: the Emek picture palace
  type: sinema
  district: beyoglu
  public: true
  description: >-
    A gilt-and-plush cinema off the Grande Rue, its foyer hung with hand-painted
    bills; the back rows of the dark circle are as private as any public place
    in the city.
  city: istanbul
  tags: [function:cinema, function:meeting-spot, access:public]
  basis: real-inspired

- id: consulate-row
  name: the British Consulate-General
  aliases:
    - { text: the consulate on the hill, distinctive: false }
  type: core/embassy
  district: beyoglu
  public: false
  description: >-
    A great walled palazzo of a consulate in Pera, flag over the gate, kavass at
    the door, its corridors of frosted glass busy with dragomans and liaison
    clerks long after the embassy itself removed to Ankara.
  city: istanbul
  tags: [function:embassy, setting:diplomatic, function:meeting-spot, access:private]
  basis: real-landmark
  sources: [src-pera-consulates]

- id: consulate-french
  name: the Palais de France
  type: core/embassy
  district: beyoglu
  public: false
  description: >-
    The French consulate in its garden off the Grande Rue, limes along the
    drive and a staff car idling in the courtyard; a quarter where every second
    gate carries a different flag.
  city: istanbul
  tags: [function:embassy, setting:diplomatic, access:private]
  basis: real-landmark
  sources: [src-pera-consulates]

- id: meyhane-cicek
  name: a meyhane in the Çiçek Pasajı
  aliases:
    - { text: the Flower Passage, distinctive: true }
  type: meyhane
  district: beyoglu
  public: true
  description: >-
    A long arcade off the Grande Rue lined with tavern tables under an iron-and-
    glass roof; trays of mezze, cloudy rakı and a lute player working the room,
    the din loud enough to cover any word spoken across a table.
  city: istanbul
  tags: [function:hotel-bar, function:meeting-spot, access:public]
  basis: real-landmark
  sources: [src-cicek-pasaji]

- id: kiosk-tunel
  name: the newsstand at the Tünel head
  type: gazete-bayii
  district: beyoglu
  public: true
  description: >-
    A green kiosk at the upper station of the little underground funicular,
    papers in five scripts pegged against the wind, the vendor keeping the
    foreign sheets under the counter for his regulars.
  city: istanbul
  tags: [function:kiosk, function:newspaper-outlet, function:dead-drop-site, access:public]
  basis: real-inspired

- id: safehouse-asmali
  name: a flat on Asmalı Mescit
  type: emin-ev
  district: beyoglu
  public: false
  description: >-
    A rented back room up three flights off a Pera side-lane, shutters half
