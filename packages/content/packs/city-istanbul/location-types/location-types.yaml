    - Shelves lean overhead on every side in a courtyard of booksellers; a bell on the door and dust in the light.
    - Stacks of unsorted volumes narrow the aisle to a single lane back to the dealer's cluttered desk.
    - Leather spines, foxed French novels and runs of yellowed almanacs — a book cipher could hide a dozen keys here.
    - A cat sleeps on the ledger while the dealer peers over half-moon glasses and names a price without troubling to look.
    - Boxes of unpriced stock block the back room, where serious buyers are taken and the curtain is left half drawn.
    - Prayer books, old maps and travellers' guides in five scripts; the dealer buys and sells letters as readily as books.
  atmosphereTags: [dusty, quiet, bookish, discreet, public]
  tags: [function:bookshop, function:public-text-source, function:dead-drop-site, access:public]

