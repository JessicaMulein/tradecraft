    - Barrels line one wall and strings of dried peppers the other; the waiter remembers every face but repeats nothing.
    - Down a flight of steps off the fish market, lamplit and close, where strangers end the night as old friends.
    - A back-street cellar of long benches, the floor sanded, the proprietor pouring from a jug and asking no names.
