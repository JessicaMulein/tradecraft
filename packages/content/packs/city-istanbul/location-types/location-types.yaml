  tags: [function:park, function:meeting-spot, function:dead-drop-site, access:public]

# --- 8. Ferry pier (vapur iskelesi) ----------------------------------------
# The city-line and Bosphorus ferries, and the piers they work. The constant
# churn of passengers makes a pier a natural transit hub and a place a watched
# person can lose a tail in the crush at the turnstile.
- id: iskele
  public: true
  allowedActions: [travel, talk, approach, confront, turn-agent, surveil, follow, service-drop, intercept, wait]
  openingHours:
    - { weekday: monday, openPhase: early-morning, closePhase: late-night }
    - { weekday: tuesday, openPhase: early-morning, closePhase: late-night }
    - { weekday: wednesday, openPhase: early-morning, closePhase: late-night }
    - { weekday: thursday, openPhase: early-morning, closePhase: late-night }
    - { weekday: friday, openPhase: early-morning, closePhase: late-night }
    - { weekday: saturday, openPhase: early-morning, closePhase: late-night }
    - { weekday: sunday, openPhase: morning, closePhase: late-night }
  crowdCurve:
    - { weekday: monday, phase: early-morning, level: 0.7 }
    - { weekday: monday, phase: morning, level: 0.9 }
    - { weekday: monday, phase: midday, level: 0.5 }
    - { weekday: monday, phase: evening, level: 0.9 }
    - { weekday: monday, phase: late-night, level: 0.2 }
    - { weekday: friday, phase: evening, level: 0.95 }
  weatherModifiers:
    - { weather: fog, crowdMultiplier: 0.6 }
    - { weather: rain, crowdMultiplier: 0.9 }
  baseRisk: 0.3
  allowsDeadDrops: true
  namePatterns:
    - '{pick:pier-names} İskelesi'
    - '{pick:pier-names} vapur iskelesi'
  descriptionPool:
    - A timber pier under an iron canopy; the ferry noses in, the ramp clangs down, and the crowd pours off and on at once.
    - A turnstile, a ticket window and a tea booth, with the smell of coal smoke and brine and the slap of water on piles.
    - Passengers press four deep for the whistle; a man can step aboard at the last moment and leave a follower on the quay.
    - The timetable is chalked on a board, the ferry's funnel streaming smoke across the Horn as it swings for the far shore.
    - Porters shoulder baskets up the ramp while gulls wheel over the churn; the deckhands cast off without ceremony.
    - A floating pontoon that rises and falls with the wash, lamplit after dark, where the last boat gathers a thin late crowd.
  atmosphereTags: [crowded, transient, anonymous, salt-air, public]
  tags: [function:transit, function:transit-hub, function:meeting-spot, function:dead-drop-site, access:public]

# --- 9. Tram stop / street corner ------------------------------------------
# Trams ran on the European side until 1961 and on the Asian side after; a stop
# is an open, exposed meeting ground where a brush pass goes unseen in the press.
