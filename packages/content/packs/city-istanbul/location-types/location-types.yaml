# location-types/location-types.yaml — the Istanbul Location Types.
#
# Each entry validates against LocationTypeSchema (the slice location-type kind,
# roles ALL_ROLES, not City-Scoped). A City Pack's Location Types are ordinary
# slice Location Types that happen to live in the City Pack, so a City Location
# references one by its namespaced id `city-istanbul/<id>`. These give Istanbul
# its own texture — the çayhane and çay bahçesi, the meyhane, the covered
# bazaar, the ferry iskele and the Pera consulate — while carrying the same Tag
# Vocabulary `function:*`, `venue:*`, `access:*` and `setting:*` Tags the
# generator's archetype schedules and Required Queries bind against. Between
# them they cover every Location function the vocabulary needs (design, "Tag
# Vocabulary"; Req 4.3, 4.4).
#
# Period: Istanbul 1950–1965. Everything here is of its time — trams on the
# Grande Rue (they ran until 1961 on the European side), the Şirket-i Hayriye
# and city-line ferries, coal smoke, the telegraph office, newspapers hawked at
# the bridge, radios in the coffee houses. No anachronism: no television in
# cafés, no self-service, no supermarkets, no later motorway or bridge.
#
# Action ids follow the slice Action union: talk, approach, confront,
# turn-agent, travel, surveil, follow, arrange-meeting, service-drop, intercept,
# read, cable, wait. travel is the arrival action and is allowed everywhere.
# Weekdays: monday … sunday. Phases: early-morning, morning, midday, afternoon,
# evening, night, late-night, dead-of-night.

# --- 1. Kahvehane / çayhane (coffee & tea house) ---------------------------
- id: kahvehane
  public: true
  allowedActions: [travel, talk, approach, confront, turn-agent, surveil, follow, arrange-meeting, read, wait]
  openingHours:
    - { weekday: monday, openPhase: early-morning, closePhase: night }
    - { weekday: tuesday, openPhase: early-morning, closePhase: night }
    - { weekday: wednesday, openPhase: early-morning, closePhase: night }
    - { weekday: thursday, openPhase: early-morning, closePhase: night }
    - { weekday: friday, openPhase: early-morning, closePhase: late-night }
    - { weekday: saturday, openPhase: early-morning, closePhase: late-night }
    - { weekday: sunday, openPhase: morning, closePhase: night }
  crowdCurve:
    - { weekday: monday, phase: morning, level: 0.5 }
    - { weekday: monday, phase: midday, level: 0.6 }
    - { weekday: monday, phase: afternoon, level: 0.8 }
    - { weekday: monday, phase: evening, level: 0.7 }
    - { weekday: friday, phase: afternoon, level: 0.9 }
    - { weekday: sunday, phase: afternoon, level: 0.85 }
  weatherModifiers:
    - { weather: rain, crowdMultiplier: 1.25 }
    - { weather: cold, crowdMultiplier: 1.2 }
    - { weather: hot, crowdMultiplier: 0.85 }
  baseRisk: 0.15
  allowsDeadDrops: false
  namePatterns:
    - '{pick:cafe-names}'
  descriptionPool:
    - Low stools and copper trays; the boy swings a brazier of coals to the water-pipes and tea comes in tulip glasses.
    - Men bent over backgammon under a haze of smoke, the dice rattling while a radio murmurs the afternoon news.
    - A narrow room open to the lane, its mirrors foxed with age, where the same faces have held the same corner for years.
    - Glasses of tea pass hand to hand on little saucers; nobody hurries and nobody minds who sits an hour over one.
    - The hiss of the samovar, the click of worry-beads, and a view of the street framed by a bead curtain in the doorway.
    - A tea garden under a plane tree, chairs set out to the kerb, where a quiet word is lost in the general murmur.
  atmosphereTags: [smoky, unhurried, convivial, public]
  tags: [venue:cafe, function:cafe, function:meeting-spot, access:public]

