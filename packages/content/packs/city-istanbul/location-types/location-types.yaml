    - { weekday: monday, phase: evening, level: 0.8 }
    - { weekday: monday, phase: midday, level: 0.4 }
  weatherModifiers:
    - { weather: rain, crowdMultiplier: 0.9 }
    - { weather: hot, crowdMultiplier: 0.95 }
  baseRisk: 0.2
  allowsDeadDrops: false
  namePatterns:
    - '{pick:commercial} durağı'
    - 'the corner of {pick:commercial}'
  descriptionPool:
    - A tram grinds up the hill and slows at the kerb; the waiting crowd shuffles and reforms as it clatters away.
    - Rails curve off into the dusk between the shopfronts; the overhead wire sings and sparks blue at the junction.
    - A knot of commuters under a tin shelter, newspapers up against the wind off the water.
    - A pasted timetable peels under glass; the cobbles shine wet and the rails hum before the car comes into view.
    - Two lines cross here and the stop is never empty for long — someone always boarding, someone always left behind.
    - The conductor leans from the platform ringing his bell; the crowd surges and a careful man times his step to the last.
  atmosphereTags: [transient, crowded, exposed, public]
  tags: [function:transit, function:transit-hub, function:meeting-spot, access:public]

