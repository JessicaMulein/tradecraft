    - Formal beds dug over for winter, a locked pavilion, and paths that carry the sound of every footstep behind you.
    - A hilltop of cypresses over the old cemeteries, still and shaded, where two people may walk and not be overheard.
    - A simit-seller tends his tray at the railings; the ferries slide past below and the gulls work the wake.
    - Children chase pigeons across the square while nursemaids compare notes on a bench and miss nothing that passes.
