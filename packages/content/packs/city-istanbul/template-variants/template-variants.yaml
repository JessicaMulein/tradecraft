- id: var-dossier-person
  base: city-istanbul/dossier-istanbul-person
  scope: { city: istanbul }
  template: >-
    File {file-ref}. Subject {subject}, known in the {quarter}.{?alias} Also
    reported as {alias}.{/alias} Last placed at {last-seen}.{?association} In the
    company of {association}.{/association} Station assessment: {assessment}

- id: var-cable-field
  base: city-istanbul/cable-istanbul-field
  scope: { city: istanbul }
  template: >-
    {from-cover} AT ISTANBUL STATION STOP TO HEAD OFFICE STOP FILED {date} STOP
    REFERENCE {cable-ref} STOP ON THE MATTER OF {subject} STOP {observation} STOP
    {?request}REQUESTING {request} STOP{/request} HOLDING FOR ORDERS STOP CLOSE
    STOP

- id: var-seized-note
  base: city-istanbul/seized-istanbul-note
  scope: { city: istanbul }
  template: >-
    Recovered {date} at {place} by {recovered-by}. {description}; appears to
    concern {subject}. Legible contents as found: {contents}

# =========================================================================
# Variants of the shared core Document templates (slot sets per
# packs/core/documents.yaml), re-voiced for Istanbul.
# =========================================================================

- id: var-core-city
  base: core/newspaper-wiener-tagblatt-city
  scope: { city: istanbul }
  template: >-
    {masthead} — {weekday}, {date} ({edition} edition). {headline}. From the
    {district}: {subject}. {detail} The matter rests with the {official-office}.
    {?notice}Notice to readers: {notice}{/notice}

- id: var-core-blotter
  base: core/newspaper-wiener-tagblatt-blotter
  scope: { city: istanbul }
  template: >-
    {masthead}: court and police record for {date}. In the {district} a charge
    of {offence} arose near {place}; the party, {subject}, was questioned by the
    {official-office}. {outcome}

- id: var-core-notices
  base: core/newspaper-amtsblatt-notices
  scope: { city: istanbul }
  template: >-
    {masthead} — official notices, {date}. By order of the {official-office},
    effective {effective-date}: {subject}, applying within the {district}.
    {detail}

- id: var-core-dossier
  base: core/dossier-hq-person
  scope: { city: istanbul }
  template: >-
    File {file-ref}. Subject {subject}; grade {source-grade}.{?alias} Also known
    as {alias}.{/alias} Apparent allegiance: {allegiance-apparent}. Last at
    {last-seen-place} about {last-seen-date}.{?association} With
    {association}.{/association} Assessment: {assessment}

- id: var-core-cable-directive
  base: core/cable-hq-directive
  scope: { city: istanbul }
  template: >-
    CABLE {cable-ref} {priority} STOP TO {to-station} STOP {date} STOP RE
    {subject} STOP {instruction} STOP {?deadline}DEADLINE {deadline}
    STOP{/deadline} {?budget-line}FUNDS {budget-line} STOP{/budget-line} ENDS
    STOP

- id: var-core-cable-field
  base: core/cable-field-report
  scope: { city: istanbul }
  template: >-
    SENDER {from-cover} STOP FOR HEAD OFFICE STOP DATED {date} STOP OUR NUMBER
    {cable-ref} STOP CONCERNING {subject} STOP I OBSERVE {observation} STOP
    {?request}I ASK {request} STOP{/request} MESSAGE CLOSE STOP

- id: var-core-seized
  base: core/seized-handwritten-note
  scope: { city: istanbul }
  template: >-
    Recovered {date} at {place} by {recovered-by}; condition {condition}.
    {description}; appears to concern {subject}. Contents as found: {contents}
