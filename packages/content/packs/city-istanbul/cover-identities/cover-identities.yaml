# cover-identities/cover-identities.yaml — the local Cover Identities issued in
# Istanbul (content-expansion task 9.6).
#
# Each validates against CoverIdentitySchema (packages/content/src/lib/kinds.ts):
#   { id, title, employerOrg, fitLocationTypes, suspicionModifiers, tags }.
#
# `fitLocationTypes` names the Istanbul Location Types where the cover sits
# naturally; bare ids resolve to this City Pack's own Location Types (the ids in
# location-types/location-types.yaml). `tags` draws from the core `cover:*`
# facet (official | commercial | press | cultural). `atFit` is negative — the
# cover lowers suspicion where it belongs; `elsewhere` is positive.
#
# Period: Istanbul 1950–1965, a neutral crossroads of consulates, shipping,
# émigrés and wagon-lit travellers. Every title and employer is period-plausible
# and WHOLLY FICTIONAL; none names a real firm, mission or body of the period.

# --- 1. Shipping / maritime commerce (Galata) -------------------------------
- id: shipping-agent
  title: Shipping Agent
  employerOrg: Levant Maritime & Forwarding Company
  tags: [cover:commercial]
  fitLocationTypes: [core/danube-port, depo, core/hotel-bar, core/kaffeehaus, iskele]
  suspicionModifiers:
    atFit: -0.15
    elsewhere: 0.2

