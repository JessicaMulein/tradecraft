# streets/streets.yaml — the Istanbul street-name pools (task 9.5).
#
# Each entry validates against StreetsPoolSchema (city.ts): { id, names[] }. The
# generator draws addresses from these pools, and Location Type `namePatterns`
# reference them via `{pick:<pool>}` (e.g. `{pick:commercial} durağı`,
# `a room on {pick:quiet}`). Pools are grouped by texture so a place is given a
# plausible street for its District.
#
# These are real Istanbul streets, avenues and squares of the period, used as a
# name pool for texture; no address names a real business or person. Across the
# five pools there are well over sixty names (Req 11.2 target: at least sixty).

