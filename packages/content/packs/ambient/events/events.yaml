# City events. Each category has two exogenous and two reactive templates.
# A stage lasts at least two days, so the opening effect is visible before it eases.

- id: labour-1
  category: labour
  class: exogenous
  weight: 3
  cooldownDays: 14
  name: "Dock strike"
  durationDays: [2, 4]
  stages:
    - day: 0
      ops:
        - { op: metric-delta, metric: unrest, delta: 0.08 }
        - { op: crowd-modifier, at: { query: [function:port] }, factor: 1.4 }
        - { op: news-development, story: strike, beat: announced }
        - { op: spawn-thread, tags: [labour] }
    - day: last
      ops:
        - { op: metric-delta, metric: unrest, delta: -0.04 }
        - { op: news-development, story: strike, beat: resolved }

