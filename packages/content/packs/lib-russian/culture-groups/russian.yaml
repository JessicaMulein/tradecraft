  voiceTraits:
    - correct and watchful, giving away little
    - formal in the extreme with strangers
    - speaks in careful circumlocutions about the state
    - warms suddenly over tea and shared grievance
    - quotes a proverb to close a dangerous subject
  mannerisms:
    - pauses before every answer as if weighing it
    - offers tea and refuses to begin without it
    - keeps both hands visible on the table
    - lets a long silence do the work of a reply
    - glances once at the door and never again
  backgrounds:
    - text: Posted to the city with the occupation administration and billeted near the garrison.
      tags: []
      years: { from: 1945, to: 1955 }
    - text: Works as a translator for a trade delegation and is trusted by neither side entirely.
      tags: []
    - text: Came as a technical adviser and keeps to the compound more than the city.
      tags: []
    - text: Clerks at a cultural mission and files reports no one admits to reading.
      tags: []
    - text: Served in the war, was decorated, and speaks of none of it to foreigners.
      tags: []
    - text: Keeps the accounts for a state import office and knows which invoices are fictions.
      tags: []
    - text: Teaches language at the mission school and listens more than the pupils know.
      tags: []
    - text: Drives for the delegation and remembers every address and every passenger.
      tags: []
