# culture-groups/russian.yaml — the Russian group.
#
# A CultureGroup (CultureGroupSchema). Russian names take a patronymic between
# the given and family name, so the Naming Rule's `parts.patronymic` carries the
# gendered endings -ovich (m) / -ovna (f) the engine appends to the father's
# name (design, NamingRule). Russian surnames inflect by gender (-ov / -ova,
# -in / -ina, -sky / -skaya), so family names are gendered pairs { m, f }; the
# generator picks the form matching the drawn NPC's gender.
#
# Quantity (Req 11.4): at least 100 given and 100 family names, at least 300
# distinct total. Names are transliterated to the Latin alphabet (the slice
# renderer and Specifics Guard work in Latin text). All names are generic,
# common Russian names of the period in fictional use; none names a real
# individual, and famous full-name combinations are avoided.
- id: russian
  name: Russian
  languages:
    - ru
  naming:
    display: '{given} {patronymic} {family}'
    formal: '{honorific} {family}'
    parts:
      patronymic:
        m: ovich
        f: ovna
