  fitLocationTypes: [core/bookshop, core/library, core/kaffeehaus, imbiss-kiosk]
  suspicionModifiers:
    atFit: -0.2
    elsewhere: 0.24

# A liaison interpreter attached to the inter-allied missions: moves between the
