# cover-identities.yaml - the local Cover Identities for divided Berlin
# (content-expansion task 9.4).
#
# Each entry is a CoverIdentity (CoverIdentitySchema, packages/content/src/lib/
# kinds.ts): { id, title, employerOrg, fitLocationTypes, suspicionModifiers,
# tags }. `fitLocationTypes` names the Location Types where the cover sits
# plausibly: a Berlin City-Scoped type by its bare id (resolved to
# city-berlin/<id>) or a core type as `core/<id>`. `tags` draws from the core
# `cover:*` facet (required - a Cover Identity must carry at least one Tag).
# `suspicionModifiers.atFit` is negative (the cover lowers suspicion where it
# belongs) and `elsewhere` positive.
#
# These are Berlin-specific covers to set beside the core roster, each tied to a
# local employer and the city's own places - the U-Bahn and S-Bahn, the Spree
# wharves, the newsstand kiosks, the embassy-row missions and the western
# administration offices. EVERY title and employer is period-plausible for
# 1948-1961 divided Berlin and wholly fictional.

# A clerk of the western district registry: a plausible reason to be in the
# administration offices, the reading halls and the cafes where the city's
# paperwork and permits are discussed.
- id: registry-clerk
  title: Registry Clerk
  employerOrg: The Western District Registry
  tags: [cover:official]
  fitLocationTypes: [core/embassy, core/library, core/kaffeehaus, u-bahn-station]
  suspicionModifiers:
    atFit: -0.14
    elsewhere: 0.2

# A correspondent for the liberal western weekly: at home among the hotel bars,
# the cafes, the reading halls and the picture houses where the city's talk is.
- id: feuilleton-correspondent
  title: Feuilleton Correspondent
  employerOrg: Spree-Wochenschau
  tags: [cover:press]
  fitLocationTypes: [core/kaffeehaus, core/library, core/hotel-bar, core/cinema]
  suspicionModifiers:
    atFit: -0.12
    elsewhere: 0.16

# A traffic inspector for the city railway authority: a reason to be at every
# U-Bahn and S-Bahn platform and on the lines that cross the sector boundary,
# checking schedules, crews and ticket offices.
- id: railway-inspector
  title: Railway Traffic Inspector
  employerOrg: The City Railway Authority
  tags: [cover:official]
  fitLocationTypes: [u-bahn-station, s-bahn-station, imbiss-kiosk, core/market]
  suspicionModifiers:
    atFit: -0.13
    elsewhere: 0.19

# A freight and forwarding agent working the canal wharves: belongs on the
