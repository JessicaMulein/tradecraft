# streets/streets.yaml - Berlin street and place name pools (task 9.3).
#
# Each pool validates against StreetsPoolSchema (packages/content/src/kinds/
# city.ts): { id, names[] }. The generator draws addresses from these pools and
# Location Type `namePatterns` reference them with `{pick:<pool>}`.
#
# The street-name pools below (grand, commercial, residential, waterfront,
# quiet, industrial) hold well over sixty real Berlin street names of the
# period, grouped by texture so a Location sits on a plausible street for its
# district. The `ubahn-names` and `sbahn-names` pools name real stations of the
# divided city's underground and city railways, which the transit-hub Location
# Types stamp their names from. Street and station names are real public
# topography (cited in `sources/`); no business or person is named here.

