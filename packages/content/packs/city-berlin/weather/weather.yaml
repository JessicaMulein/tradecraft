# weather/weather.yaml - Berlin's monthly weather tables (task 9.3).
#
# Validates against WeatherTablesSchema (packages/content/src/kinds/city.ts): a
# single record { city, months } where `months` carries all twelve calendar
# months (1 = January ... 12 = December), each a weighted list of
# WeatherConditions { id, label, weight }. The daily stream selects the month
# from the date and draws one condition from that month's table; Location Types
# key crowd modifiers off the condition `id` (rain, snow, sleet, fog,
# thunderstorm, clear, humid, overcast).
#
# Berlin's climate is humid continental: cold, often snowy winters and warm,
# sometimes thundery summers, with grey wet shoulders in spring and autumn. The
# condition words are plain period weather - no anachronism. The weights shift
# month by month so winter leans to snow, fog and overcast and high summer to
# clear, humid and thunderstorms.
- city: berlin
  months:
    '1': # January - deep winter
      - { id: clear-cold, label: clear and bitter, weight: 3 }
      - { id: overcast, label: low grey cloud, weight: 4 }
      - { id: snow, label: falling snow, weight: 4 }
      - { id: fog, label: freezing fog, weight: 2 }
      - { id: sleet, label: sleet and slush, weight: 2 }
    '2': # February - late winter
      - { id: clear-cold, label: hard and clear, weight: 3 }
      - { id: overcast, label: heavy grey sky, weight: 4 }
      - { id: snow, label: driving snow, weight: 3 }
      - { id: fog, label: cold fog, weight: 2 }
      - { id: sleet, label: sleet, weight: 2 }
    '3': # March - early spring
      - { id: clear, label: bright and raw, weight: 3 }
      - { id: overcast, label: grey and blustery, weight: 4 }
      - { id: rain, label: cold rain, weight: 3 }
      - { id: snow, label: wet late snow, weight: 1 }
      - { id: fog, label: morning haze, weight: 1 }
    '4': # April - spring
      - { id: clear, label: bright and mild, weight: 4 }
      - { id: overcast, label: scudding cloud, weight: 3 }
      - { id: rain, label: showers, weight: 3 }
      - { id: thunderstorm, label: a spring squall, weight: 1 }
    '5': # May - late spring
      - { id: clear, label: warm and clear, weight: 5 }
      - { id: overcast, label: hazy sun, weight: 2 }
      - { id: rain, label: steady rain, weight: 2 }
      - { id: thunderstorm, label: an afternoon storm, weight: 2 }
    '6': # June - early summer
      - { id: clear, label: warm and bright, weight: 5 }
      - { id: humid, label: close and still, weight: 2 }
      - { id: thunderstorm, label: a thunderstorm, weight: 2 }
      - { id: rain, label: warm rain, weight: 1 }
    '7': # July - high summer
      - { id: clear, label: hot and clear, weight: 5 }
      - { id: humid, label: close and humid, weight: 3 }
      - { id: thunderstorm, label: an evening thunderstorm, weight: 2 }
      - { id: rain, label: a warm downpour, weight: 1 }
    '8': # August - high summer
      - { id: clear, label: warm and clear, weight: 5 }
      - { id: humid, label: heavy and humid, weight: 3 }
      - { id: thunderstorm, label: a thunderstorm, weight: 2 }
      - { id: rain, label: warm rain, weight: 1 }
    '9': # September - early autumn
      - { id: clear, label: mild and clear, weight: 4 }
      - { id: overcast, label: grey and still, weight: 3 }
      - { id: rain, label: steady rain, weight: 2 }
      - { id: fog, label: river fog, weight: 2 }
    '10': # October - autumn
      - { id: clear, label: crisp and clear, weight: 3 }
      - { id: overcast, label: flat grey sky, weight: 4 }
      - { id: rain, label: cold rain, weight: 3 }
      - { id: fog, label: thick morning fog, weight: 3 }
    '11': # November - late autumn
      - { id: overcast, label: raw and grey, weight: 5 }
      - { id: rain, label: cold rain, weight: 3 }
      - { id: fog, label: thick river fog, weight: 3 }
      - { id: clear-cold, label: clear and cold, weight: 2 }
    '12': # December - early winter
      - { id: overcast, label: low grey cloud, weight: 4 }
      - { id: snow, label: falling snow, weight: 3 }
      - { id: clear-cold, label: clear and freezing, weight: 3 }
      - { id: fog, label: freezing fog, weight: 2 }
      - { id: sleet, label: sleet and slush, weight: 2 }
