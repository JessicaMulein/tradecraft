# =========================================================================
# ADDITIONAL LOCATIONS (task 9.3)
#
# These widen the authored Location pool well beyond the per-seed
# instantiation bound (`instantiation.locations` [20, 28]) so that different
# seeds draw different subsets and the Coverage Report's Variety Metric stays
# below target. They add no new Location Type and no new Required Query; each
# is a public meeting spot, newspaper outlet, dead-drop site or private room
# that deepens an existing District's texture. The four-sector structure and
# the U/S-Bahn hubs above are untouched. Every proper name on a business is
# fictional; the streets and squares are real topography, cited.
#
# With these, the pool is 43 Locations across the eight Districts (at least
# three per District), so a seed drawing twenty to twenty-eight of them leaves
# a varying remainder behind.

