# locations/locations.yaml - the authored Locations of Berlin (task 9.3).
#
# Each validates against CityLocationSchema (packages/content/src/kinds/
# city.ts): the slice Location fields (id, name, aliases, `type`, `district`,
# `public`, description, atmosphere) plus the City-Scoped additions (`city`,
# `tags`, `basis`, optional `years`, `sources`, optional `weight`).
#
# `type` names the Location Type the place is stamped from: a Berlin City-Scoped
# type by its bare id (`u-bahn-station`, `s-bahn-station`, `spree-wharf`,
# `imbiss-kiosk`) or a core type as `core/<id>`. A Location's Effective Tags are
# its own `tags` here together with its Location Type's tags; Tag Conformance
# counts those against the city's Required Queries, so the set below places at
# least the required number of binders for every query, across all eight
# districts.
#
# `basis` is `real-landmark` for a place drawn from a real site of the period
# (which then cites `sources`), `real-inspired` for a fictional place modelled
# on a real kind of site, and `fictional` for a wholly invented one. Every
# proper name attached to a business, café, shop, hotel or office is fictional;
# the streets, stations, park, canal and airfield are real topography, cited.
#
# Counts: 48 Locations across the eight districts. The upper instantiation
#   bound (`instantiation.locations` [20, 28]) draws at most 28, so the authored
#   pool comfortably exceeds the per-seed selection and different seeds draw
#   different subsets — this is what keeps the Coverage Report's Variety Metric
#   (mean pairwise Jaccard of the per-seed Location sets) below the 0.6 target.
#   Required Query coverage grows with the additions and never falls below the
#   originals' margins: station-office 1, public-text-source 2, newspaper-outlet
#   8, public meeting spot 20, dead-drop 24, transit-hub 5, materiel-store 3,
#   diplomatic 2, private 7, and at least one of every per-function query.

# =========================================================================
# MITTE (Soviet sector)
# =========================================================================

- id: stadtmitte-ubahn
  name: Stadtmitte U-Bahn station
  aliases:
    - { text: the Stadtmitte interchange, distinctive: true }
  type: u-bahn-station
  district: mitte
  public: true
  description: >-
    An interchange deep under the eastern centre where two lines cross; the
    platforms run beneath the sector boundary, and a traveller can change here
    for trains that surface in either half of the city.
  atmosphere: [underground, echoing, watched]
  city: berlin
  tags: [function:transit, function:transit-hub]
  basis: real-landmark
  sources: [berlin-railway-guide, berlin-city-plan]

- id: lindenallee-cafe
  name: Café Lindenblick
  aliases:
    - { text: the Lindenblick, distinctive: true }
  type: core/kaffeehaus
  district: mitte
  public: true
  description: >-
    A high old coffee house on the great avenue, its mirrors darkened and its
    marble tables chipped, where ministry clerks take a bitter coffee and the
    waiter remembers who sat with whom.
  atmosphere: [smoky, genteel, watched]
  city: berlin
  tags: [function:cafe, function:meeting-spot, access:public]
  basis: real-inspired

- id: staatsbibliothek-reading-room
  name: The eastern reading hall
  aliases:
    - { text: the reading hall, distinctive: false }
  type: core/library
  district: mitte
  public: true
  description: >-
    A hushed public reading hall of long oak tables and green-shaded lamps,
    its catalogue walls patched where the war took the upper galleries; readers
    sit walled behind borrowed books and no one hurries them.
  atmosphere: [hushed, studious, discreet]
  city: berlin
  tags: [function:library, function:public-text-source, function:dead-drop-site, access:public]
  basis: real-inspired
  sources: [berlin-street-directory]

- id: friedrichstrasse-sbahn
  name: Friedrichstraße S-Bahn station
  aliases:
    - { text: the Friedrichstraße crossing, distinctive: true }
    - { text: the great interchange, distinctive: false }
  type: s-bahn-station
  district: mitte
  public: true
  description: >-
    The city's busiest crossing point: a vaulted hall of iron and glass where
    the underground, the city railway and the long-distance trains all meet, and
    where a traveller from the west steps off into the eastern sector among a
    river of strangers.
  atmosphere: [crowded, transient, anonymous, watched]
  city: berlin
  tags: [function:transit, function:transit-hub, function:meeting-spot, function:newspaper-outlet, function:dead-drop-site, access:public]
  basis: real-landmark
  sources: [berlin-railway-guide, berlin-city-plan]

