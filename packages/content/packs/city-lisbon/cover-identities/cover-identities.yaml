# cover-identities.yaml — the Lisbon local Cover Identities (content-expansion
# task 9.8).
#
# Each entry validates against CoverIdentitySchema (packages/content/src/lib/
# kinds.ts): a title, the employer organisation, the `tags` (a `cover:*` facet
# Tag), the Location Types where the cover fits plausibly (bare ids resolved to
# this City Pack's Location Types), and the Cover Suspicion modifiers it carries
# at a fitting place (`atFit`, negative) versus elsewhere (`elsewhere`,
# positive).
#
# The fit Location Types are the Lisbon types from this pack's
# location-types.yaml: cafe, tabacaria, biblioteca, alfarrabista, hotel-bar,
# pensao, miradouro, elevador, electrico-stop, cais-fluvial, doca, armazem,
# legacao, aerodromo, estacao.
#
# Every title and employer is fictional and period-plausible for a neutral
# Atlantic capital of 1945–1965: the trade, press, relief and shipping covers a
# foreign agent could carry in a city crowded with émigrés, correspondents and
# passing traffic. No real body of the period is named.

- id: shipping-line-clerk
  title: Passenger Agent
  employerOrg: Companhia de Navegação do Tejo e Atlântico
  tags: [cover:commercial]
  fitLocationTypes: [doca, cais-fluvial, estacao, hotel-bar]
  suspicionModifiers:
    atFit: -0.15
    elsewhere: 0.2

