# locations.yaml — the authored Locations of Lisbon (task 9.7).
#
# Each is a City Location (packages/content/src/kinds/city.ts,
# CityLocationSchema): a place pinned to a District and stamped from a Location
# Type (a Lisbon type from `location-types/`, or a core slice type by its
# `core/<id>` id). A Location's Effective Tags are its own `tags` together with
# its Location Type's Tags; the loader's Tag Conformance stage (task 2.3) counts
# a Location toward a Required Query when its Effective Tags satisfy the query
# within the city's Period Window.
#
# There are 27 Locations spread across all eight Districts — comfortably past
# the release floor of 25 Locations over 6 Districts (Req 11.2) — and tagged so
# every Required Query in the core Tag Vocabulary clears its per-city static
# minimum with margin, feasible for any Start Date in 1945–1965. The two
# year-ranged entries (the seaplane terminal, phased out as the land airport
# grew; a dockside bar that closed mid-period) exercise the Year Range filter
# while leaving every Required Query bound across the whole window.
#
# `basis` records how each Location relates to the real city: `real-landmark`
# for a place that really stood (and is cited in sources.yaml), `real-inspired`
# for a fictional place drawn from a real type of place, `fictional` for a
# wholly invented one. Every real landmark cites at least one Source. All names
# of cafés, hotels, shops, bars and firms are invented; the quarters, squares,
# monuments, stations, trams and lifts they sit on or beside are real.

# =========================================================================
# BAIXA — the commercial lower town
# =========================================================================

- id: cafe-rossio
  name: Café Portela do Rossio
  type: core/kaffeehaus
  district: baixa
  public: true
  description: >-
    A grand marble-and-mirror café on the Rossio, its outdoor tables under the
    arcade facing the fountains and the ceaseless churn of the square.
  atmosphere: [grand-marble, arcade-seating, rossio-society]
  city: lisbon
  tags: [function:cafe, function:meeting-spot, access:public]
  basis: real-inspired
  sources: [src-rossio]

- id: tabacaria-ouro
  name: Tabacaria da Rua do Ouro
  type: tabacaria
  district: baixa
  public: true
  description: >-
    A tiled kiosk on the Rua do Ouro among the jewellers and banks, the foreign
    papers pegged on a line and the lottery results chalked up by the till.
  atmosphere: [tiled-booth, jewellers-row, lottery-queue]
  city: lisbon
  tags: [function:kiosk, function:newspaper-outlet, function:dead-drop-site, access:public]
  basis: real-inspired
  sources: [src-baixa-grid]

- id: estacao-rossio
  name: Rossio Station
  type: estacao
  district: baixa
  public: true
  description: >-
    The horseshoe-arched terminus at the head of the Rossio, its booking hall
    loud under the glass roof, the Sintra trains and the night expresses coming
    and going past the left-luggage lockers.
  atmosphere: [horseshoe-arch, glass-roof-din, sintra-trains]
  city: lisbon
  tags: [function:transit, function:transit-hub, function:meeting-spot, function:dead-drop-site, function:newspaper-outlet, access:public]
  basis: real-landmark
  sources: [src-rossio-station]

- id: posto-baixa
  name: the Station
  type: posto
  district: baixa
  public: false
  description: >-
    A floor of locked offices behind an unmarked door off a Baixa side street,
    the cipher room and the file registry giving onto a light-well no one
    overlooks.
  atmosphere: [station-secure, unmarked-door, cipher-room-quiet]
  city: lisbon
  tags: [venue:station-office, function:station, access:private]
  basis: fictional

- id: banco-ultramar
  name: Casa Bancária Vale & Nogueira
  type: armazem
  district: baixa
  public: false
  description: >-
    The strongroom floor of a private banking house on the Rua Augusta, its
    bonded store of ledgers, bullion crates and shipping documents behind a
    grilled door and a night watchman.
  atmosphere: [strongroom-guarded, bullion-crates, deserted-after-dark]
  city: lisbon
  tags: [function:warehouse, function:materiel-store, function:dead-drop-site, access:private]
  basis: fictional

