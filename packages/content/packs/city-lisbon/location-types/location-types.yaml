    - Rails curve off downhill into the glare; a conductor leans from the open platform and the overhead wire sings in the wind.
    - A knot of passengers under a cast-iron shelter, baskets and newspapers up against the gusting rain off the river.
    - A pasted timetable peels under cracked glass; two lines cross here and the stop is never empty for long.
    - The old wooden car grinds in with its bell going; a press of people boards before the last of them is off.
    - The wires spark blue at the junction and the crowd leans out to look up the hill for the next car to come down.
