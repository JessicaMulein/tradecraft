# location-types.yaml — the Lisbon-specific Location Types (task 9.7).
#
# Each entry is a slice Location Type (LocationTypeSchema, packages/content/src/
# lib/kinds.ts), City-Scoped by living in this City Pack. A City Location's
# `type` names one of these (or a core slice type); the Location inherits the
# type's function Tags as part of its Effective Tags, which the loader's Tag
# Conformance stage (task 2.3) checks the city's Required Query binders against.
#
# These types give Lisbon its own texture — the hill funiculars (elevadores),
# the yellow trams (eléctricos), the Tagus river stations (cais), the Atlantic
# port, the Portela airport, the émigré hotels and pensões, and the belvederes
# (miradouros) — while tagging each with the shared `function:*` vocabulary so
# the generator's archetype schedules and setting step bind here exactly as they
# do in the core city. Name patterns draw from the pools in `streets/`.
#
# Period: 1945–1965 neutral Lisbon. Everything is of its time — trams, funicular
# cars, telegraph, steamers and flying boats, coal and cork, newspapers and the
# wireless. No anachronism past 1965.
#
# Phases, in order: early-morning, morning, midday, afternoon, evening, night,
# late-night, dead-of-night. Weekdays: monday … sunday.

# --- 1. Café / casa de pasto ----------------------------------------------
# A Lisbon café: marble tables, a zinc counter, strong bica coffee and the slow
# turnover of men who read the papers and watch the street for hours.
- id: cafe
  public: true
  allowedActions: [travel, talk, approach, confront, turn-agent, surveil, follow, arrange-meeting, read, wait]
  openingHours:
    - { weekday: monday, openPhase: early-morning, closePhase: night }
    - { weekday: tuesday, openPhase: early-morning, closePhase: night }
    - { weekday: wednesday, openPhase: early-morning, closePhase: night }
    - { weekday: thursday, openPhase: early-morning, closePhase: night }
    - { weekday: friday, openPhase: early-morning, closePhase: late-night }
    - { weekday: saturday, openPhase: early-morning, closePhase: late-night }
    - { weekday: sunday, openPhase: morning, closePhase: night }
  crowdCurve:
    - { weekday: monday, phase: morning, level: 0.5 }
    - { weekday: monday, phase: midday, level: 0.7 }
    - { weekday: monday, phase: afternoon, level: 0.75 }
    - { weekday: saturday, phase: afternoon, level: 0.9 }
  weatherModifiers:
    - { weather: rain, crowdMultiplier: 1.25 }
    - { weather: clear, crowdMultiplier: 0.9 }
  baseRisk: 0.15
  allowsDeadDrops: false
  namePatterns:
    - '{pick:cafe-names}'
  descriptionPool:
    - A long room of marble-topped tables and a zinc counter, loud with the hiss of the coffee urn and the slap of dominoes.
    - Mirrors and dark wood, a glass case of custard tarts, and old men who nurse a single bica through the whole afternoon.
    - Waiters in white jackets weave between the tables; a rack of the day's papers hangs by the door and nobody hurries.
    - Tiled walls to the ceiling, a ceiling fan turning slow, and the talk of trade and football and nothing that matters.
    - A corner table by the window where a man can watch the whole street and be taken for just another idler over coffee.
    - The marble sweats in the heat; a boy runs trays of coffee out to the shops and offices and back with the empties.
  atmosphereTags: [smoky, unhurried, watchful, public]
  tags: [venue:cafe, function:cafe, function:meeting-spot, access:public]

# --- 2. Tabacaria / newsstand kiosk ---------------------------------------
# A tobacconist-and-newspaper kiosk: cigarettes, lottery slips, the foreign
# papers a day late, and a proprietor who knows every regular.
- id: tabacaria
  public: true
  allowedActions: [travel, talk, approach, confront, turn-agent, surveil, service-drop, read, wait]
  openingHours:
    - { weekday: monday, openPhase: early-morning, closePhase: evening }
    - { weekday: tuesday, openPhase: early-morning, closePhase: evening }
    - { weekday: wednesday, openPhase: early-morning, closePhase: evening }
    - { weekday: thursday, openPhase: early-morning, closePhase: evening }
    - { weekday: friday, openPhase: early-morning, closePhase: evening }
    - { weekday: saturday, openPhase: early-morning, closePhase: midday }
  crowdCurve:
    - { weekday: monday, phase: early-morning, level: 0.4 }
    - { weekday: monday, phase: morning, level: 0.5 }
    - { weekday: monday, phase: evening, level: 0.35 }
  weatherModifiers:
    - { weather: rain, crowdMultiplier: 0.8 }
  baseRisk: 0.2
  allowsDeadDrops: true
  namePatterns:
    - '{pick:tabacaria-names}'
  descriptionPool:
    - A tiled kiosk of cigarettes and folded newspapers, lottery slips fanned under the glass and the counter worn smooth.
    - Picture postcards of the river and the castle turn on a wire rack; the proprietor knows every regular by their brand.
    - A hole in the wall at the tram stop, foreign papers a day late pegged on a line, its shutter half down against the sun.
    - Matches in a tin, a rack of pipe tobacco, and the morning editions still smelling of ink stacked by the till.
    - The queue forms and dissolves before you have your change; a boy sorts the afternoon papers on the step.
    - A narrow booth that smells of tobacco and newsprint, the lottery results chalked up fresh on a slate by the window.
  atmosphereTags: [cramped, everyday, watchful, public]
  tags: [function:kiosk, function:dead-drop-site, function:newspaper-outlet, access:public]

# --- 3. Public reading room / library -------------------------------------
