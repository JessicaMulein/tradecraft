    - { weather: rain, crowdMultiplier: 1.2 }
  baseRisk: 0.1
  allowsDeadDrops: true
  namePatterns:
    - '{pick:library-names}'
  descriptionPool:
    - A hushed reading hall of long tables and brass lamps, the air dry with old paper and floor wax.
    - Tall shuttered windows throw bars of light across ranks of periodicals chained to their stands.
    - A clerk stamps requests behind a grille; the only sounds are turning pages and the slow tick of a wall clock.
    - Galleries of shelving climb into the gloom, reached by a spiral stair, the catalogue drawers worn pale at the handles.
    - Students and pensioners share the long tables in silence, each walled behind a rampart of borrowed books.
    - The reading room smells of leather and dust; a request slip left in a certain volume would wait unread for days.
