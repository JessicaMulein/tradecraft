    - A long iron shed over the water, the ferry churning in to the pontoon while the crowd presses at the barrier.
    - Steamers for the far bank load at the gangways; a smell of tar and tide and the shriek of gulls over the slip.
    - The commuters pour off the morning boat from Cacilhas and up the ramp in a tide of hats and bicycles and baskets.
    - A ticket hall of tiled walls and a brass turnstile; beyond it the pontoon rises and falls on the river swell.
    - Fishwives with their flat baskets wait for the boat; a river policeman watches the gangway and checks nothing.
    - The last ferry of the evening sounds its horn out in the dark; a dropped parcel on the empty pontoon waits unseen.
