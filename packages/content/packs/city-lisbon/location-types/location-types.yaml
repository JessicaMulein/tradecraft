    - High rooms smelling of floor wax and sealing wax, telephones ringing behind doors, a porter who checks your papers twice.
    - Engraved plates ranked by the bellpull, a doorman in a braided coat, and an inner yard where a legation car waits in the shade.
    - Steel cabinets wall every passage; a folder trolley squeaks by on the parquet and a buzzer calls some clerk away unseen.
    - A long queue of the stateless winds down the steps and along the railings, papers clutched against the Atlantic wind.
  atmosphereTags: [official, guarded, bureaucratic, cover-friendly]
