# --- 5. Émigré hotel bar / hotel de passagem ------------------------------
# The hotel bars of neutral Lisbon, where refugees waiting for passage, wire-
# service men, attachés and the agents of every service drank side by side.
- id: hotel-bar
  public: true
  allowedActions: [travel, talk, approach, confront, turn-agent, surveil, follow, arrange-meeting, wait]
  openingHours:
    - { weekday: monday, openPhase: afternoon, closePhase: late-night }
    - { weekday: tuesday, openPhase: afternoon, closePhase: late-night }
    - { weekday: wednesday, openPhase: afternoon, closePhase: late-night }
    - { weekday: thursday, openPhase: afternoon, closePhase: late-night }
    - { weekday: friday, openPhase: afternoon, closePhase: dead-of-night }
    - { weekday: saturday, openPhase: afternoon, closePhase: dead-of-night }
    - { weekday: sunday, openPhase: evening, closePhase: late-night }
  crowdCurve:
    - { weekday: monday, phase: evening, level: 0.5 }
    - { weekday: friday, phase: night, level: 0.9 }
    - { weekday: saturday, phase: night, level: 0.9 }
  weatherModifiers:
    - { weather: rain, crowdMultiplier: 1.1 }
  baseRisk: 0.3
  allowsDeadDrops: false
  namePatterns:
    - 'the bar of {pick:hotel-names}'
    - '{pick:bar-names}, {pick:hotel-names}'
  descriptionPool:
    - A low-lit bar of polished mahogany and brass, a pianist turning over something slow while the waiters pour and forget.
    - Refugees with their last good suitcases, correspondents and attachés hold the stools; the talk runs in five languages.
    - Cut glass and cigarette haze; every third conversation drops to a murmur as you pass, then resumes a half-truth behind you.
    - Deep cane chairs around low tables, a page in buttons by the revolving door, bottles lit from behind like relics.
    - A bowl of salted almonds goes round and round; a man can wait here a week for a visa or a word and look like a guest.
    - The windows give on the square and the lit kiosks beyond; a draught of warm night air each time the door turns.
  atmosphereTags: [cosmopolitan, smoky, loose-tongued, watched, public]
  tags: [function:hotel-bar, function:meeting-spot, access:public]

# --- 6. Émigré pensão / lodging house -------------------------------------
# A boarding house of the sort refugees and transients lodged in while they
# waited for passage out: a private address a landlady could be made to forget.
- id: pensao
  public: false
  allowedActions: [travel, talk, confront, turn-agent, arrange-meeting, read, wait]
  openingHours:
    - { weekday: monday, openPhase: early-morning, closePhase: dead-of-night }
    - { weekday: tuesday, openPhase: early-morning, closePhase: dead-of-night }
    - { weekday: wednesday, openPhase: early-morning, closePhase: dead-of-night }
    - { weekday: thursday, openPhase: early-morning, closePhase: dead-of-night }
    - { weekday: friday, openPhase: early-morning, closePhase: dead-of-night }
    - { weekday: saturday, openPhase: early-morning, closePhase: dead-of-night }
    - { weekday: sunday, openPhase: early-morning, closePhase: dead-of-night }
  crowdCurve:
    - { weekday: monday, phase: evening, level: 0.2 }
    - { weekday: monday, phase: night, level: 0.15 }
  weatherModifiers: []
  baseRisk: 0.12
  allowsDeadDrops: false
  namePatterns:
    - '{pick:pensao-names}'
  descriptionPool:
    - A boarding house up three flights, its one window on the back giving onto a light-well no one overlooks.
    - A hall table of unclaimed letters, a smell of cooking oil and floor polish, and a landlady who misses nothing.
    - Thin walls, a shared bathroom down the landing, and the kind of address forgotten the moment the rent is paid.
    - A room kept deliberately dull — a bed, a washstand, a crucifix — curtains always half drawn against the street below.
    - The stair creaks on the fourth tread, a free warning; the door carries a chain and the key hangs on a nail by the bed.
    - Transients come and go with their cases; the register is kept in pencil and amended more often than it should be.
  atmosphereTags: [private, transient, spare, concealed]
  tags: [function:safehouse, access:private]

# --- 7. Belvedere / miradouro (open-air meeting ground) --------------------
# A terraced lookout over the city and the river — gravel, a kiosk, benches
# under the trees. An open place where a meeting reads as two men taking the air.
- id: miradouro
  public: true
  allowedActions: [travel, talk, approach, confront, turn-agent, surveil, follow, arrange-meeting, service-drop, wait]
  openingHours:
    - { weekday: monday, openPhase: early-morning, closePhase: late-night }
    - { weekday: tuesday, openPhase: early-morning, closePhase: late-night }
    - { weekday: wednesday, openPhase: early-morning, closePhase: late-night }
    - { weekday: thursday, openPhase: early-morning, closePhase: late-night }
    - { weekday: friday, openPhase: early-morning, closePhase: late-night }
    - { weekday: saturday, openPhase: early-morning, closePhase: late-night }
    - { weekday: sunday, openPhase: early-morning, closePhase: late-night }
  crowdCurve:
    - { weekday: monday, phase: afternoon, level: 0.4 }
    - { weekday: sunday, phase: afternoon, level: 0.85 }
    - { weekday: monday, phase: night, level: 0.1 }
  weatherModifiers:
    - { weather: rain, crowdMultiplier: 0.4 }
    - { weather: clear, crowdMultiplier: 1.3 }
    - { weather: thunderstorm, crowdMultiplier: 0.2 }
  baseRisk: 0.2
  allowsDeadDrops: true
  namePatterns:
    - '{pick:miradouro-names}'
  descriptionPool:
    - A gravel terrace above the roofs, the river spread out below silver and wide, a kiosk selling coffee and lemonade.
    - Benches under clipped trees face the view; an old man feeds the pigeons and a courting couple keep their backs to the path.
    - Tiled benches and a trellis of bougainvillaea; from here the whole lower town steps down to the water in red tile and white wall.
    - A balustrade of worn stone, a telescope on a stand that no longer works, and the castle on its hill across the valley.
    - The afternoon light turns the river to brass; a man can lean on the rail here for an hour and be taken for a tourist.
    - At dusk the lamps come up across the city below; the terrace empties but for a few lovers and the kiosk shutting up.
  atmosphereTags: [open-air, exposed, meeting-ground, public]
  tags: [function:park, function:meeting-spot, function:dead-drop-site, access:public]

# --- 8. Elevador / funicular (hill lift) -----------------------------------
# A Lisbon street funicular or lift — the Glória, the Bica, the Santa Justa —
# climbing the steep hills. A short, busy ride where strangers stand pressed
# together and a watched man can board or step off unremarked.
- id: elevador
  public: true
  allowedActions: [travel, talk, approach, confront, turn-agent, surveil, follow, wait]
  openingHours:
    - { weekday: monday, openPhase: early-morning, closePhase: night }
    - { weekday: tuesday, openPhase: early-morning, closePhase: night }
    - { weekday: wednesday, openPhase: early-morning, closePhase: night }
    - { weekday: thursday, openPhase: early-morning, closePhase: night }
    - { weekday: friday, openPhase: early-morning, closePhase: late-night }
    - { weekday: saturday, openPhase: early-morning, closePhase: late-night }
    - { weekday: sunday, openPhase: morning, closePhase: night }
  crowdCurve:
    - { weekday: monday, phase: early-morning, level: 0.6 }
    - { weekday: monday, phase: morning, level: 0.8 }
    - { weekday: monday, phase: evening, level: 0.75 }
  weatherModifiers:
    - { weather: rain, crowdMultiplier: 1.1 }
  baseRisk: 0.22
  allowsDeadDrops: false
  namePatterns:
    - '{pick:elevador-names}'
  descriptionPool:
    - A varnished funicular car grinding up the cobbled slope on its cable, the conductor swinging from the open platform.
    - The two cars pass at the halfway loop; passengers crowd the wooden benches and hang from the brass rails on the turns.
    - A steep street of tram rails and overhead wire, the lift car creaking up between tiled housefronts almost close enough to touch.
    - The iron cage of the great street lift hums up its tower; the city falls away through the lattice as it climbs.
    - A short, jolting ride packed shoulder to shoulder; a man can board at the foot and be lost in the upper town in two minutes.
    - The car fills and empties at each end in a press of baskets and briefcases; the gateman never looks twice at a face.
  atmosphereTags: [transient, crowded, exposed, public]
  tags: [function:transit, function:transit-hub, function:meeting-spot, access:public]

