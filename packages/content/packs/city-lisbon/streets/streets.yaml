# streets.yaml — the Lisbon street-name and venue-name pools (task 9.7).
#
# Each is a streets pool (packages/content/src/kinds/city.ts, StreetsPoolSchema):
# an `id` and a list of names. The generator draws addresses from the street
# pools, and a Location Type `namePatterns` entry `{pick:<pool>}` draws a venue
# name from the matching pool here.
#
# The `street-*` pools are real streets, squares and quays of Lisbon, pooled by
# texture so a Location can be placed on a plausible address for its District
# (the real streets are attested in sources.yaml). They total well past the
# release floor of 60 street names (Req 11.2).
#
# The venue-name pools (cafe-names, hotel-names, …) are INVENTED names in the
# Portuguese of the period; none names a real Lisbon business of 1945–1965.
# They supply the proper names the Location Types stamp.

# =========================================================================
# STREETS — real Lisbon streets, squares and quays (pooled by texture)
# =========================================================================

