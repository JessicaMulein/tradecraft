# weather.yaml — Lisbon's monthly weather tables (task 9.7).
#
# A single WeatherTables record (packages/content/src/kinds/city.ts): one
# weighted condition table per calendar month (1 = January … 12 = December).
# The daily stream selects the month from the date and draws one condition from
# that month's table; a Location Type's `weatherModifiers` key off the condition
# `id`, so the ids reuse the vocabulary the core Location Types already match on
# (`rain`, `fog`, `clear`, `overcast`, `thunderstorm`), with `humid` for the
# close summer days and `clear-cold` for the sharp winter mornings.
#
# Climate: Lisbon's Mediterranean / Atlantic climate — mild damp winters off the
# ocean, long warm dry summers, and the sea fog (the nortada haze and the
# river mist) common in the shoulder seasons. Winters are wet and grey but
# rarely cold; high summer is reliably clear and warm. Every label is a plain
# weather word a Lisboeta of the period would use. No anachronism.

city: lisbon
months:
  # January — the wet heart of winter: Atlantic fronts, grey and raw.
  '1':
    - { id: rain, label: 'Atlantic rain off the sea', weight: 5 }
    - { id: overcast, label: 'low grey cloud', weight: 4 }
    - { id: clear-cold, label: 'clear and sharp', weight: 2 }
    - { id: fog, label: 'river mist', weight: 2 }
  # February — still wet, the fronts coming through in bands.
  '2':
    - { id: rain, label: 'rain and a wet wind', weight: 5 }
    - { id: overcast, label: 'overcast and raw', weight: 4 }
    - { id: clear-cold, label: 'bright and cold', weight: 2 }
    - { id: fog, label: 'morning fog on the river', weight: 1 }
  # March — the turn of the year; showers and brightening spells.
  '3':
    - { id: rain, label: 'blustery showers', weight: 4 }
    - { id: overcast, label: 'grey and breezy', weight: 3 }
    - { id: clear, label: 'bright and freshening', weight: 3 }
    - { id: fog, label: 'morning haze', weight: 1 }
  # April — mild and changeable, the first warm days.
  '4':
    - { id: clear, label: 'bright and mild', weight: 4 }
    - { id: rain, label: 'passing April shower', weight: 3 }
    - { id: overcast, label: 'soft grey cloud', weight: 2 }
    - { id: fog, label: 'sea haze in the morning', weight: 1 }
  # May — the long dry season begins; warm and clear.
  '5':
    - { id: clear, label: 'warm and clear', weight: 5 }
    - { id: overcast, label: 'high cloud', weight: 2 }
    - { id: rain, label: 'a late shower', weight: 1 }
    - { id: fog, label: 'coastal haze', weight: 1 }
  # June — settled summer; warm, the sea breeze in the afternoon.
  '6':
    - { id: clear, label: 'warm and clear', weight: 6 }
    - { id: humid, label: 'close and still', weight: 2 }
    - { id: fog, label: 'morning sea fog', weight: 1 }
  # July — high summer; hot, dry, the nortada wind off the ocean.
  '7':
    - { id: clear, label: 'hot and clear', weight: 7 }
    - { id: humid, label: 'close and hazy', weight: 2 }
    - { id: fog, label: 'early sea fog burning off', weight: 1 }
  # August — the hottest, driest month; long bright days.
  '8':
    - { id: clear, label: 'hot and dry', weight: 7 }
    - { id: humid, label: 'heavy and close', weight: 2 }
    - { id: thunderstorm, label: 'a rare heat thunderstorm', weight: 1 }
  # September — still warm and dry, the heat easing.
  '9':
    - { id: clear, label: 'warm and clear', weight: 5 }
    - { id: humid, label: 'close and still', weight: 2 }
    - { id: thunderstorm, label: 'an evening thunderstorm', weight: 1 }
    - { id: fog, label: 'river mist at dawn', weight: 1 }
  # October — the rains return; mild and changeable.
  '10':
    - { id: rain, label: 'the first autumn rain', weight: 4 }
    - { id: clear, label: 'crisp and bright', weight: 3 }
    - { id: overcast, label: 'grey and mild', weight: 3 }
    - { id: fog, label: 'thick river fog', weight: 2 }
  # November — wet and grey, the Atlantic fronts crowding in.
  '11':
    - { id: rain, label: 'steady cold rain', weight: 5 }
    - { id: overcast, label: 'low grey cloud', weight: 4 }
    - { id: fog, label: 'fog off the river', weight: 2 }
    - { id: clear, label: 'a clear mild spell', weight: 2 }
  # December — the depth of the wet season; raw and grey.
  '12':
    - { id: rain, label: 'rain and a raw wind', weight: 5 }
    - { id: overcast, label: 'dark and overcast', weight: 4 }
    - { id: clear-cold, label: 'clear and sharp', weight: 2 }
    - { id: fog, label: 'river mist', weight: 2 }
