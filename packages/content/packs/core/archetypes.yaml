# Period archetypes for the `core` pack — 1950s four-power-occupation Vienna.
#
# These are the templates the world generator stamps Principal and Background
# NPCs from (Requirements 1.3, 27.1, 29.1). Every character produced from them
# is fictional; no archetype represents a real historical individual.
#
# Each entry validates against ArchetypeSchema in packages/content/src/lib/
# kinds.ts. `allowedAllegiances` match the role: a cell role is only ever on
# the Cell, a hostile officer only on the Hostile Service, station staff only
# on the Station; a contact reads as neutral but may be a quiet Station friend;
# a civilian is neutral or, until the player establishes it, unknown.
#
# personaPools reference persona libraries by id (task 3.2): `austrian`,
# `soviet`, `american`, `british`, `french`. descriptorPools reference
# descriptor libraries (task 3.2).
#
# `schedule` entries bind through the Tag Vocabulary (content-expansion task
# 1.6): each slot's `at` is a Tag Query the slot resolves to the Instantiated
# City's Binders of, and `fallback` is the Tag Query used when a city binds
# none of a slot's `at`. The `function:` tags below mirror the former Location
# Type ids (cafe, safehouse, hotel-bar, park, kiosk, transit, embassy, station,
# warehouse, port, library, bookshop, cinema); task 7.1 finalises the core Tag
# Vocabulary and may refine these values.
#
# MICE ranges are the recruitment-lever bands the generator samples a profile
# from; wariness is how guarded the character is before any pitch.

