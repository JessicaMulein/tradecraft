# city.yaml — 1950s occupied Vienna, four-power occupation.
#
# This file holds the Viennese geography the world generator stamps Districts,
# Locations and Routes from, plus the Central European weather tables the daily
# stream reads. It also carries the name pools that Location Type `namePatterns`
# draw from via `{pick:<pool>}` (for example `{pick:cafe-names}`).
#
# Occupation texture: after 1945 Vienna was split into four sectors held by the
# United States, the United Kingdom, France and the Soviet Union, with the Inner
# City (the First District) run jointly as an international zone patrolled by all
# four powers in rotation ("four men in a jeep"). The sector a District sits in
# shapes who patrols it, how papers are checked, and how a crossing feels. All
# of it is period texture; every character and organisation in play is fictional.
#
# The loader tolerates this file (it is in the ignored set), so the shape here is
# chosen for later tasks rather than a schema. Keep it clean, consistent YAML.

id: vienna-1952
displayName: Vienna
era: '1950s'
occupation: four-power

# --- Sectors ---------------------------------------------------------------
# The four occupying powers plus the jointly administered international zone.
sectors:
  - id: international
    power: four-power
    label: International Zone
    note: >-
      The Inner City, administered jointly; patrols rotate monthly between the
      four powers and ride together in a single jeep.
  - id: american
    power: american
    label: American Sector
  - id: british
    power: british
    label: British Sector
  - id: french
    power: french
    label: French Sector
  - id: soviet
    power: soviet
    label: Soviet Sector
    note: >-
      The city sits inside the Soviet zone of Lower Austria, so every road
      out crosses a Soviet checkpoint. Papers are checked more often in this
      sector, and strangers are remembered.

# --- Districts -------------------------------------------------------------
# A representative spread of the city's numbered Bezirke, each tagged with the
# sector that holds it. Districts are the nodes the Route graph connects.
districts:
  - id: innere-stadt
    number: 1
    name: Innere Stadt
    sector: international
    character: >-
      The old core inside the Ring: the cathedral, the ministries, the grand
      cafés and the hotels where every delegation keeps a table.
  - id: leopoldstadt
    number: 2
    name: Leopoldstadt
    sector: soviet
    character: >-
      Across the Danube Canal; the great park, the fairground wheel, and quiet
      streets where a watched man can lose a tail or acquire one.
  - id: landstrasse
    number: 3
    name: Landstraße
    sector: british
    character: >-
      Legation quarter of villas and garden walls; the diplomatic traffic here
      is heavy and the pavements are swept.
  - id: wieden
    number: 4
    name: Wieden
    sector: soviet
    character: Dense tenements, a market square, and tram lines in every direction.
  - id: mariahilf
    number: 6
    name: Mariahilf
    sector: french
    character: >-
      The long shopping street and its side alleys; crowds thin to nothing after
      the shutters come down.
  - id: alsergrund
    number: 9
    name: Alsergrund
    sector: american
    character: >-
      Hospitals, lecture halls and lodging houses; students, clerks and the odd
      correspondent filing from a rented room.
  - id: favoriten
    number: 10
    name: Favoriten
    sector: soviet
    character: >-
      Workers' blocks, rail sidings and a gasworks; a long way from the Ring and
      it feels it.
  - id: brigittenau
    number: 20
    name: Brigittenau
    sector: soviet
    character: >-
      Warehouses and the harbour hinterland between the canal and the river,
      where lorries idle at odd hours.

