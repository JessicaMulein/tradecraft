# --- Weather tables --------------------------------------------------------
# Central European seasons. The daily stream draws one `condition` per day,
# weighted; Location Types key crowd modifiers off the condition `id`. No
# anachronisms — these are plain weather words a 1950s Viennese would use.
weather:
  seasons:
    winter:
      months: [12, 1, 2]
      conditions:
        - { id: clear-cold, label: 'clear and bitter', weight: 3 }
        - { id: overcast, label: 'low grey cloud', weight: 4 }
        - { id: snow, label: 'falling snow', weight: 3 }
        - { id: fog, label: 'river fog', weight: 2 }
        - { id: sleet, label: 'sleet and slush', weight: 2 }
    spring:
      months: [3, 4, 5]
      conditions:
        - { id: clear, label: 'bright and mild', weight: 4 }
        - { id: overcast, label: 'overcast', weight: 3 }
        - { id: rain, label: 'steady rain', weight: 3 }
        - { id: fog, label: 'morning haze', weight: 1 }
    summer:
      months: [6, 7, 8]
      conditions:
        - { id: clear, label: 'warm and clear', weight: 5 }
        - { id: humid, label: 'close and humid', weight: 3 }
        - { id: thunderstorm, label: 'afternoon thunderstorm', weight: 2 }
        - { id: rain, label: 'warm rain', weight: 1 }
    autumn:
      months: [9, 10, 11]
      conditions:
        - { id: clear, label: 'crisp and clear', weight: 3 }
        - { id: overcast, label: 'grey and still', weight: 4 }
        - { id: rain, label: 'cold rain', weight: 3 }
        - { id: fog, label: 'thick river fog', weight: 3 }
  # Tags the Location Type `weatherModifiers` match on. A Location raises or
  # lowers its crowd when the day's condition carries the tag.
  tags:
    - rain
    - snow
    - sleet
    - fog
    - thunderstorm
    - clear
    - humid
    - overcast
