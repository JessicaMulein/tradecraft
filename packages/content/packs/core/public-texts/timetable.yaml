# public-texts/timetable.yaml — a period Vienna tram and rail timetable.
#
# A public text and a keyable corpus for the book cipher (Requirement 9.2). A
# timetable is a classic book-cipher key: it is public, widely held, printed in
# a fixed order, and dense with words, numbers, station names and line numbers.
# The loader tolerates files under public-texts/, so the shape serves the
# composers (task 5.6) rather than a schema; keep it clean, consistent YAML.
#
# Period and setting: tram and local rail in 1950s occupied Vienna. Line numbers
# and the ring layout are period-plausible; every station and halt name here is
# INVENTED, and any business or square named is fictional. Times are given in
# the 24-hour clock as a public timetable of the day would print them.

id: timetable-vienna-tram-rail
kind: public-text
title: City Tramway and Local Railway Timetable
publisher: Municipal Transport Office
genre: timetable
notes:
  - Services run daily unless marked. Sunday and holiday services are reduced.
  - Passengers must show papers on request at any crossing between sectors.
  - The first and last departures are printed for each line; intermediate cars
    run at the stated interval.
  - Fares are by zone. A transfer ticket is valid for one hour from the time of
    issue and may not be used for a return journey.

# --- Tram lines ------------------------------------------------------------
# Each line lists its number, its named stops in order, and its service hours.
tram_lines:
  - line: 1
    name: Inner Ring
    direction: clockwise about the old town
    first_departure: '05:12'
    last_departure: '23:48'
    interval_minutes: 6
    stops:
      - Cathedral Square
      - Old Gate
      - Linden Avenue
      - Mint Court
      - River Steps
      - Lamplighters' Row
      - Chancery Corner
      - Cathedral Square
  - line: 2
    name: Outer Ring
    direction: anti-clockwise about the old town
    first_departure: '05:04'
    last_departure: '23:40'
    interval_minutes: 6
    stops:
      - North Gate Market
      - Arsenal Walk
      - Foundry Bridge
      - Hospital Lane
      - Botanic Gardens
      - Observatory Hill
      - West Barracks
      - North Gate Market
  - line: 5
    name: River Line
    direction: from the inner town to the port
    first_departure: '04:50'
    last_departure: '00:12'
    interval_minutes: 8
    stops:
      - Cathedral Square
      - Customs House
      - Grain Quay
      - Timber Wharf
      - Ferry Steps
      - Port Office
      - Lower Harbour
  - line: 9
    name: Vineyard Line
    direction: from the ring to the northern hills
    first_departure: '05:30'
    last_departure: '22:54'
    interval_minutes: 12
    stops:
      - Chancery Corner
      - University Gate
      - Printers' Square
      - Elm Terrace
      - Vineyard Halt
      - Hilltop Chapel
      - Belvedere Turn
  - line: 11
    name: Factory Line
    direction: from the ring to the eastern works
    first_departure: '04:36'
    last_departure: '23:06'
    interval_minutes: 7
    stops:
      - Old Gate
      - Canal Bridge
      - Gasworks Halt
      - Weavers' Yard
      - Rolling Mill
      - East Depot
  - line: 18
    name: Cemetery Line
    direction: from the south gate to the great cemetery
    first_departure: '05:18'
    last_departure: '21:42'
    interval_minutes: 15
    stops:
      - South Gate
      - Rose Market
      - Stonemasons' Row
      - Chapel of Rest
      - Great Cemetery

