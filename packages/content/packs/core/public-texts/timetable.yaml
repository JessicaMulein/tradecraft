# A closing public notice, as the printed timetable would carry.
notice: >-
  The transport office regrets that services may be delayed at crossings between
  sectors when papers are inspected. Passengers are asked to allow extra time in
  the early morning and the evening, to keep their tickets until the end of the
  journey, and to give up their seats to the elderly and to mothers with young
  children. The office thanks the public for its patience and good order.
