    - A strongroom door stands ajar on rows of sealed files; the Chief's office is the only one with a carpet.
    - A kettle on the gas ring, a wall of pigeonholes, and a window painted over so no one across the street can read the room.
    - The teleprinter chatters out the overnight traffic; a clerk tears the sheets and spikes them by priority.
