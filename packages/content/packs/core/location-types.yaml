    - { weather: snow, crowdMultiplier: 0.85 }
  baseRisk: 0.2
  allowsDeadDrops: false
  namePatterns:
    - Haltestelle {pick:commercial}
    - the corner of {pick:commercial}
  descriptionPool:
    - A clanging red tram slows at the kerb; the waiting crowd shuffles and reforms as it pulls away.
    - Rails curve off into the grey; a conductor leans from the platform and the overhead wire sings.
    - A knot of commuters under a cast-iron shelter, newspapers up against the wind.
    - A pasted timetable peels under glass; the cobbles shine wet and the rails hum before the tram comes into view.
    - Two lines cross here and the stop is never empty for long — someone always boarding, someone always left behind.
    - The overhead wires spark blue at the junction; the crowd leans out to look up the street for the next car.
  atmosphereTags: [transient, crowded, exposed, public]
  tags: [function:transit, function:transit-hub, function:meeting-spot, access:public]
# --- 14. Heuriger (wine tavern) --------------------------------------------
# A Viennese wine tavern on the city's edge, where the new wine is served under
# the trees. Busy in the warm months and at weekends; a loose, convivial place
# where a quiet word in a crowd goes unremarked.
