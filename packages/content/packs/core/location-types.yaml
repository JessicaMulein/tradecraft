  descriptionPool:
    - A tiled foyer with a glass box office, lobby cards under lights, and the muffled roar of the feature within.
    - Plush seats in rows sloping to a screen; the projector beam cuts the smoke and the newsreel drones its headlines.
    - A gilt proscenium, a velvet curtain, and an usherette with a torch patrolling the dark aisle for the latecomers.
    - The back rows are kept for courting couples and anyone who would rather watch the door than the picture.
    - Between showings the house lights come up on a litter of tickets and programmes and a slow shuffle for the exits.
    - A matinee half-empty on a weekday afternoon, where two strangers can sit a seat apart and never be remarked on.
  atmosphereTags: [dark, anonymous, meeting-ground, crowded, public]
  tags: [function:cinema, function:meeting-spot, function:dead-drop-site, access:public]

# --- 16. Market (open-air stalls) ------------------------------------------
# A permanent produce and goods market of stalls and barrows. Loud, dense and
# fast-moving in the mornings; a crowd a watched man can lose himself in, and a
# place where a thing can change hands under cover of a transaction.
