    - { weekday: tuesday, openPhase: early-morning, closePhase: afternoon }
    - { weekday: wednesday, openPhase: early-morning, closePhase: afternoon }
    - { weekday: thursday, openPhase: early-morning, closePhase: afternoon }
    - { weekday: friday, openPhase: early-morning, closePhase: evening }
    - { weekday: saturday, openPhase: early-morning, closePhase: evening }
