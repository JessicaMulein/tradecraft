    - { weekday: monday, phase: midday, level: 0.7 }
    - { weekday: monday, phase: afternoon, level: 0.3 }
    - { weekday: saturday, phase: morning, level: 0.95 }
    - { weekday: friday, phase: evening, level: 0.6 }
