    - { weather: rain, crowdMultiplier: 0.5 }
    - { weather: snow, crowdMultiplier: 0.3 }
    - { weather: thunderstorm, crowdMultiplier: 0.3 }
  baseRisk: 0.2
  allowsDeadDrops: false
  namePatterns:
    - '{pick:heuriger-names}'
  descriptionPool:
    - Long trestle tables under a vine arbour; a bush of pine over the gate says the new wine is poured.
    - Benches crowd a cobbled courtyard where a zither player works the far corner and no one listens too closely.
    - Jugs of cloudy young wine come and go; the talk runs loud and the faces blur pleasantly in the lamplight.
    - A hand-chalked board names the vintage; the proprietor's family carries plates of cold meat between the tables.
    - String lights sway over the garden and the hum of two hundred conversations swallows anything said at arm's length.
    - Up the hill past the last tram stop, where the city thins to vineyards and a man can arrive unseen from either side.
  atmosphereTags: [convivial, open-air, loose-tongued, crowded, public]
  tags: [venue:tavern, function:hotel-bar, function:meeting-spot, access:public]

# --- 15. Cinema ------------------------------------------------------------
# A picture house running the week's programme. The dark auditorium and the
# fixed showtimes make it a natural meeting ground; a seat in the back rows is
# as private as any public place in the city.
