  descriptionPool:
    - Rows of canvas-awned stalls under a hubbub of haggling; the gutters run with ice-melt and cabbage leaves.
    - Barrows of root vegetables and winter apples, a butcher's slab, and a flower stall bright against the grey.
    - The crowd packs the narrow lanes between the trestles; a careful man could pass a parcel and never break stride.
    - Scales swing and coins change hands; a loudspeaker van parked at the edge crackles out the morning's prices.
    - A hall of permanent stands beyond the open stalls, its glass roof dripping, loud with the clatter of the trade.
    - By mid-afternoon the barrows are half empty and the sweepers move in; a few traders argue over the unsold stock.
  atmosphereTags: [crowded, bustling, everyday, concealing, public]
