# location-types.yaml — the Location Types the Vienna generator stamps.
#
# Each entry is validated against LocationTypeSchema (packages/content/src/lib
# /kinds.ts). A Location Type fixes whether its Locations are public, which
# actions they allow, their weekly opening hours and crowd curve, how weather
# bends the crowd, the base risk of being there, whether it can hold a dead
# drop, the name patterns the generator stamps names from (drawing on city.yaml
# pools via `{pick:<pool>}`), and the description and atmosphere pools.
#
# Period: 1950s occupied Vienna. Everything here is of its time — trams, radio,
# telegraph, coal smoke, newspapers, the fairground wheel in the Prater. No
# anachronisms: no television sets, no self-service, no plastic, no supermarkets.
#
# Action ids follow the design's Action union: talk, approach, confront,
# turn-agent, travel, surveil, follow, arrange-meeting, service-drop, intercept,
# read, cable, wait. Each Location allows the subset that makes sense there
# (travel is the arrival action, so it is allowed everywhere a player can go).
# Confront and turn-agent are pressed face to face, inside a talk scene, so they
# are allowed wherever talk is. Decrypt, task, pay, feed and arrest are not done
# at a Location (Workbench work, an Asset's Contact Channel, a request to the
# Station), so the engine does not gate them here and no Location lists them.
#
# Weekdays: monday … sunday. Phases, in order: early-morning, morning, midday,
# afternoon, evening, night, late-night, dead-of-night. Opening hours are an
# inclusive open/close phase per weekday; where a Location is open the same
# hours all week the entry simply lists all seven weekdays.

# --- 1. Kaffeehaus ---------------------------------------------------------
- id: kaffeehaus
  public: true
  allowedActions: [travel, talk, approach, confront, turn-agent, surveil, follow, arrange-meeting, read, wait]
  openingHours:
    - { weekday: monday, openPhase: early-morning, closePhase: night }
    - { weekday: tuesday, openPhase: early-morning, closePhase: night }
    - { weekday: wednesday, openPhase: early-morning, closePhase: night }
    - { weekday: thursday, openPhase: early-morning, closePhase: night }
    - { weekday: friday, openPhase: early-morning, closePhase: late-night }
    - { weekday: saturday, openPhase: early-morning, closePhase: late-night }
    - { weekday: sunday, openPhase: morning, closePhase: night }
  crowdCurve:
    - { weekday: monday, phase: morning, level: 0.5 }
    - { weekday: monday, phase: midday, level: 0.7 }
    - { weekday: monday, phase: afternoon, level: 0.8 }
    - { weekday: monday, phase: evening, level: 0.6 }
    - { weekday: saturday, phase: afternoon, level: 0.9 }
    - { weekday: sunday, phase: afternoon, level: 0.85 }
  weatherModifiers:
    - { weather: rain, crowdMultiplier: 1.25 }
    - { weather: snow, crowdMultiplier: 1.3 }
    - { weather: sleet, crowdMultiplier: 1.3 }
    - { weather: clear, crowdMultiplier: 0.9 }
  baseRisk: 0.15
  allowsDeadDrops: false
  namePatterns:
    - '{pick:cafe-names}'
  descriptionPool:
    - A high room of marble tables and bentwood chairs, thick with coffee steam and cigarette smoke.
    - Waiters in black move between the newspaper racks; a billiard ball clicks somewhere behind the pillars.
    - Velvet banquettes line the walls and a single waiter guards the till like a sacristan.
    - Glasses of water on silver trays, a rack of day-old foreign papers, and the hiss of the great brass machine.
    - Mirrors darkened with age double the room; two old men play chess by the window and no one hurries them.
    - A marble-topped corner where a man can nurse one small black coffee for a whole afternoon and be left in peace.
    - Chandeliers under a smoke-yellowed ceiling; the murmur of a dozen half-heard conversations never quite stops.
  atmosphereTags: [smoky, genteel, unhurried, public]
  tags: [venue:cafe, function:cafe, function:meeting-spot, access:public]

