# cover-identities.yaml — the Cover Identities the player can be issued.
#
# Each entry is validated against CoverIdentitySchema (packages/content/src/lib
# /kinds.ts): a title, the employer organisation, the Location Types where the
# cover fits plausibly (bare ids resolved to this pack's Location Types), and
# the Cover Suspicion modifiers it carries at a fitting place versus elsewhere.
#
# `atFit` is negative — the cover lowers suspicion where it belongs. `elsewhere`
# is positive — being somewhere the cover has no business raises it. All titles
# and organisations are period-plausible for 1950s occupied Vienna and wholly
# fictional; none names a real body of the period.

- id: trade-attache
  title: Trade Attaché
  employerOrg: Allied Trade Mission
  tags: [cover:official]
  fitLocationTypes: [embassy, hotel-bar, kaffeehaus, station-hq]
  suspicionModifiers:
    atFit: -0.15
    elsewhere: 0.2

