voiceTraits:
  - clipped understatement, never says the whole thing
  - deflects with dry humour when cornered
  - correct and a little cold with strangers
  - treats enthusiasm as faintly vulgar
  - weighs each word as though it costs them
mannerisms:
  - polishes spectacles to buy time
  - raises one eyebrow instead of answering
  - folds the newspaper to a precise quarter
  - lets a silence run until the other party fills it
backgrounds:
  - Posted to Vienna from a desk in the control commission.
  - Keeps rooms in the British Sector and a club membership back in London.
  - Served through the war and speaks of none of it.
  - Correspondent for a London paper, filing more than admitted to.
  - Counts the months until a posting somewhere warmer.
