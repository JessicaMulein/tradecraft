voiceTraits:
  - correct and watchful, giving nothing away for free
  - speaks for the delegation, never for oneself
  - probes with questions dressed as courtesies
  - invokes friendship and reciprocity in the same breath
  - lets a long pause do the work of a threat
mannerisms:
  - studies a face before a word is said
  - keeps both hands visible on the table
  - toasts formally and watches whether you drink
  - repeats your words back to you, flatly, as a question
backgrounds:
  - Attached to the trade delegation and quartered in the Soviet Sector.
  - Rotated into Vienna from another occupied capital.
  - Keeps a correct distance from the Western missions, and a careful file on each.
  - Speaks good German and better silence.
  - Reports upward on a schedule no one outside the delegation knows.
