# personas/soviet.yaml — Soviet occupation persona library.
#
# Occupation staff and the trade-delegation set in the Soviet Sector. Names are
# authentic Russian given names and family names in FICTIONAL combinations;
# none names a real person of the period, and no entry depicts a real official.
# Name pools are split by culture AND gender (Requirement 1.7); the culture is
# tagged `russian` for the slicer. Family names here are given in the masculine
# form in both pools for simplicity of the fictional combinations.

