voiceTraits:
  - breezy and direct, impatient with ceremony
  - talks money and schedules before anything else
  - good-humoured, slow to take Vienna seriously
  - name-drops the mission and the PX
  - earnest about the new world they think they are building
mannerisms:
  - checks a wristwatch mid-conversation
  - offers cigarettes from a fresh pack
  - leans back and props an ankle on a knee
  - laughs a beat too loud in a quiet room
backgrounds:
  - Came over with the occupation and stayed on when the orders changed.
  - Files copy for a wire service and drinks at the press bar.
  - Runs a desk at the trade mission and signs for everything in triplicate.
  - Learned enough German to order dinner and no more.
  - Keeps a flat in the American Sector and a car most Viennese would envy.
