# personas/austrian.yaml — the Viennese persona library.
#
# A Persona library (PersonaLibrarySchema) carries name pools by culture AND
# gender plus the voice traits, mannerisms and background templates the dialogue
# layer uses to dress an NPC. The generator picks a persona gender, then draws a
# given name from the matching pool and a family name (gender-neutral); see
# Requirement 1.7. All names are authentic-sounding Austrian names in FICTIONAL
# combinations; none is a real person of the period.

