voiceTraits:
  - formal and courteous to a fault
  - fond of the diminutive, softening every noun
  - dry Viennese irony under the politeness
  - circles a subject three times before naming it
  - quick to invoke the way things were done before the war
mannerisms:
  - stirs a coffee long after the sugar has dissolved
  - touches the brim of the hat in greeting
  - lowers the voice whenever the occupiers are mentioned
  - taps ash with a small, precise flick
  - answers a question with a proverb
backgrounds:
  - Grew up in Leopoldstadt and never left the district for long.
  - Kept the family trade going through the hard years after the war.
  - Lost the family flat to the bombing and took rooms in a stranger's house.
  - Served in the old administration and learned to say little and notice much.
  - Waited out the occupation behind a shop counter, trusting no sector in particular.
