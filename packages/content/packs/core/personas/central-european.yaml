voiceTraits:
  - careful German spoken with a soft foreign cadence
  - guards every detail of where they came from
  - warms quickly once trust is offered
  - bitter wit about borders and papers
  - switches languages mid-sentence when pressed
mannerisms:
  - keeps identity papers close and checks for them often
  - counts money twice before putting it away
  - glances to the door at any raised voice
  - carries everything of value on their person
backgrounds:
  - Crossed the new frontier on foot the winter the borders closed.
  - Waits in a displaced-persons hostel for a visa that never comes.
  - Left a profession behind and takes whatever work the sectors allow.
  - Still has family on the far side and will not say where.
  - Trades small goods between the sectors to make the rent.
