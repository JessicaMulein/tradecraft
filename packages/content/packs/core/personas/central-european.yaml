# personas/central-european.yaml — Central European émigré persona library.
#
# The displaced-persons Vienna of the 1950s: Hungarians, Czechs, Slovaks, Poles
# and others washed west by the war and the new borders. Names are authentic to
# those cultures but combined fictionally; no entry names a real person. Name
# pools are split by culture AND gender (Requirement 1.7); family names are
# repeated across a culture's two pools in a single fictional form.

