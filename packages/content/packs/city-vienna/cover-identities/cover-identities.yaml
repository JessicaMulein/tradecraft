- id: feuilleton-correspondent
  title: Feuilleton Correspondent
  employerOrg: Donau-Rundschau
  tags: [cover:press]
  fitLocationTypes: [kaffeehaus, lesehalle, hotelbar, kino, heuriger]
  suspicionModifiers:
    atFit: -0.12
    elsewhere: 0.16

