# cover-identities.yaml — the local Cover Identities for occupied Vienna
# (content-expansion task 9.2).
#
# Each entry is a CoverIdentity (CoverIdentitySchema, packages/content/src/lib/
# kinds.ts): { id, title, employerOrg, fitLocationTypes, suspicionModifiers,
# tags }. `fitLocationTypes` names the city Location Types where the cover sits
# plausibly (bare ids resolved to this pack's Location Types, city-vienna/<id>);
# `tags` draws from the core `cover:*` facet (required — a Cover Identity must
# carry at least one Tag). `suspicionModifiers.atFit` is negative (the cover
# lowers suspicion where it belongs) and `elsewhere` positive.
#
# These are Vienna-specific covers to set beside the core roster: each is tied
# to a local employer and the city's own Location Types (the Kaffeehaus, the
# Lesehalle, the Donauhafen, the Legation, and so on). EVERY title and employer
# is period-plausible for 1945–1955 occupied Vienna and wholly fictional.

# A clerk of the municipal registry: a plausible reason to be in the offices,
# the reading halls and the cafés where the city's paperwork is discussed.
- id: magistrate-clerk
  title: Registry Clerk
  employerOrg: The Municipal Registry Office
  tags: [cover:official]
  fitLocationTypes: [legation, lesehalle, kaffeehaus, haltestelle]
  suspicionModifiers:
    atFit: -0.14
    elsewhere: 0.2

# A café-house correspondent for the liberal weekly: at home among the marble
