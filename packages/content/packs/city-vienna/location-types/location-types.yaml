# location-types.yaml — Vienna's city-specific slice Location Types
# (content-expansion task 9.1).
#
# These are ordinary slice Location Types (LocationTypeSchema), City-Scoped by
# living in this City Pack. A City Location's `type` references one of these by
# its bare id (the loader namespaces it `city-vienna/<id>`). A Location's
# Effective Tags are its own Tags plus its Location Type's Tags, so the Tags
# below carry the `function:*` / `venue:*` / `access:*` / `setting:*` slots the
# core Required Queries bind against; the Locations in `locations/` then satisfy
# every Required Query with margin.
#
# Period: 1945–1955 occupied Vienna. Everything is of its time — trams, coal
# smoke, the fairground wheel, newspapers, the telegraph. No anachronisms. The
# description and name pools are original to this pack.
#
# Actions follow the slice Action union. Opening hours use the phase order
# early-morning → morning → midday → afternoon → evening → night → late-night →
# dead-of-night, and weekdays monday … sunday.

# --- Kaffeehaus (coffee house) ---------------------------------------------
- id: kaffeehaus
  public: true
  allowedActions: [travel, talk, approach, confront, turn-agent, surveil, follow, arrange-meeting, read, wait]
  openingHours:
    - { weekday: monday, openPhase: early-morning, closePhase: night }
    - { weekday: tuesday, openPhase: early-morning, closePhase: night }
    - { weekday: wednesday, openPhase: early-morning, closePhase: night }
    - { weekday: thursday, openPhase: early-morning, closePhase: night }
    - { weekday: friday, openPhase: early-morning, closePhase: late-night }
    - { weekday: saturday, openPhase: early-morning, closePhase: late-night }
    - { weekday: sunday, openPhase: morning, closePhase: night }
  crowdCurve:
    - { weekday: monday, phase: midday, level: 0.7 }
    - { weekday: monday, phase: afternoon, level: 0.8 }
    - { weekday: saturday, phase: afternoon, level: 0.9 }
  weatherModifiers:
    - { weather: rain, crowdMultiplier: 1.25 }
    - { weather: snow, crowdMultiplier: 1.3 }
  baseRisk: 0.15
  allowsDeadDrops: false
  namePatterns:
    - Café Mohnblume
    - Café Zur Alten Linde
  descriptionPool:
    - Steam off the great brass urn hangs under a smoke-yellowed ceiling; a waiter in a worn tailcoat ferries small coffees on a silver tray.
    - Day-old papers hang from their wooden holders by the window, and a regular reads each one cover to cover before the next arrives.
    - The marble tops are cold under the hand; a chess clock ticks in the corner and nobody is in any hurry to leave.
  atmosphereTags: [smoky, genteel, unhurried, public]
  tags: [venue:cafe, function:cafe, function:meeting-spot, function:newspaper-outlet, access:public]

