# weather.yaml — Vienna's monthly weather tables (content-expansion task 9.1).
#
# One WeatherTables record: a weighted condition table per calendar month
# (1 = January … 12 = December), in the slice weather-table format. The daily
# stream selects the month from the date and draws one condition from that
# month's table; a Location Type's `weatherModifiers` bend its crowd by the
# condition `id`. Vienna's climate is temperate continental — cold grey winters
# with snow and river fog, warm summers with afternoon thunderstorms, mild
# changeable springs and autumns. The condition ids (clear, overcast, rain,
# snow, sleet, fog, humid, thunderstorm) are the plain weather words a 1950s
# Viennese would use and match the Location Type weather modifiers.

city: vienna
months:
  '1':
    - { id: clear-cold, label: 'clear and bitter', weight: 3 }
    - { id: overcast, label: 'low grey cloud', weight: 4 }
    - { id: snow, label: 'falling snow', weight: 3 }
    - { id: fog, label: 'river fog', weight: 2 }
    - { id: sleet, label: 'sleet and slush', weight: 2 }
  '2':
    - { id: clear-cold, label: 'clear and bitter', weight: 3 }
    - { id: overcast, label: 'low grey cloud', weight: 4 }
    - { id: snow, label: 'falling snow', weight: 3 }
    - { id: fog, label: 'river fog', weight: 2 }
    - { id: sleet, label: 'sleet and slush', weight: 2 }
  '3':
    - { id: clear, label: 'bright and cold', weight: 3 }
    - { id: overcast, label: 'overcast', weight: 4 }
    - { id: rain, label: 'cold rain', weight: 3 }
    - { id: fog, label: 'morning haze', weight: 2 }
    - { id: sleet, label: 'late sleet', weight: 1 }
  '4':
    - { id: clear, label: 'bright and mild', weight: 4 }
    - { id: overcast, label: 'overcast', weight: 3 }
    - { id: rain, label: 'steady rain', weight: 3 }
    - { id: fog, label: 'morning haze', weight: 1 }
  '5':
    - { id: clear, label: 'warm and clear', weight: 5 }
    - { id: overcast, label: 'passing cloud', weight: 2 }
    - { id: rain, label: 'spring rain', weight: 3 }
    - { id: thunderstorm, label: 'evening thunderstorm', weight: 1 }
  '6':
    - { id: clear, label: 'warm and clear', weight: 5 }
    - { id: humid, label: 'close and humid', weight: 3 }
    - { id: thunderstorm, label: 'afternoon thunderstorm', weight: 2 }
    - { id: rain, label: 'warm rain', weight: 1 }
  '7':
    - { id: clear, label: 'hot and clear', weight: 5 }
    - { id: humid, label: 'close and humid', weight: 4 }
    - { id: thunderstorm, label: 'afternoon thunderstorm', weight: 3 }
    - { id: rain, label: 'warm rain', weight: 1 }
  '8':
    - { id: clear, label: 'hot and clear', weight: 5 }
    - { id: humid, label: 'close and humid', weight: 4 }
    - { id: thunderstorm, label: 'afternoon thunderstorm', weight: 3 }
    - { id: rain, label: 'warm rain', weight: 1 }
  '9':
    - { id: clear, label: 'crisp and clear', weight: 4 }
    - { id: overcast, label: 'grey and still', weight: 3 }
    - { id: rain, label: 'cool rain', weight: 3 }
    - { id: fog, label: 'morning mist', weight: 2 }
  '10':
    - { id: clear, label: 'crisp and clear', weight: 3 }
    - { id: overcast, label: 'grey and still', weight: 4 }
    - { id: rain, label: 'cold rain', weight: 3 }
    - { id: fog, label: 'thick river fog', weight: 3 }
  '11':
    - { id: overcast, label: 'low grey cloud', weight: 4 }
    - { id: rain, label: 'cold rain', weight: 3 }
    - { id: fog, label: 'thick river fog', weight: 3 }
    - { id: clear-cold, label: 'clear and cold', weight: 2 }
    - { id: sleet, label: 'first sleet', weight: 1 }
  '12':
    - { id: clear-cold, label: 'clear and bitter', weight: 3 }
    - { id: overcast, label: 'low grey cloud', weight: 4 }
    - { id: snow, label: 'falling snow', weight: 3 }
    - { id: fog, label: 'river fog', weight: 2 }
    - { id: sleet, label: 'sleet and slush', weight: 2 }
