# ===========================================================================
# Variety pool (content-expansion task 9.1): additional authored public places
# spread evenly across all eight Districts. The authored Location pool is
# deliberately larger than any single world's instantiation Location bound
# (city.yaml `instantiation.locations`), so different seeds draw different
# subsets of the selected Districts' places and the Coverage Variety Metric
# (Req 15.4) stays well under its 0.6 target rather than selecting nearly the
# same set every seed. Every place is a city Location Type Binder for the core
# Required Queries it carries, so the extra pool only ever adds binding margin;
# all organisations and people in play are fictional.

