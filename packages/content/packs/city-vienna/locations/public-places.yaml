# locations/public-places.yaml — Vienna's public City Locations
# (content-expansion task 9.1), part 1 of 2.
#
# Each is a CityLocation: an authored place pinned to a District and stamped
# from a city Location Type (`type`, a bare id namespaced `city-vienna/<id>`).
# A Location's Effective Tags are its own `tags` plus its Location Type's Tags,
# which together satisfy the core Required Queries. `basis` records how the
# place relates to the real city; a `real-landmark` cites `sources` (see
# sources.yaml). All organisations and people in play are fictional.
#
# These are the public, open-access places (cafés, kiosks, reading halls,
# bookshops, bars, parks, stations, tram stops, the market and a cinema),
# spread across all eight Districts and the four sectors.

# --- Kaffeehäuser (cafés) --------------------------------------------------
- id: cafe-mohnblume
  name: Café Mohnblume
  type: kaffeehaus
  district: innere-stadt
  public: true
  description: >-
    A grand coffee house off the Graben, all marble and mirrors, where every
    delegation keeps a corner table and the headwaiter remembers which papers
    each regular reads.
  atmosphere: [marble and mirrors, a corner table for every delegation, cigarette haze]
