# streets.yaml — Vienna street-name pools (content-expansion task 9.1).
#
# One or more StreetsPool records, each a named list of street names the
# generator draws addresses from and Location Type `namePatterns` reference via
# `{pick:<pool>}`. Pooled by texture so a Location sits on a plausible street
# for its District. The names are authentic Viennese thoroughfares of the
# period; using a street name is not an endorsement of any business on it, and
# every place and person in play is fictional. The pools together list well
# over sixty streets (CE-QUANTITY, Req 11.2).

