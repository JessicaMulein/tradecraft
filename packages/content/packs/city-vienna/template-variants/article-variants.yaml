# article-variants.yaml — Vienna variants of the city article base templates
# (content-expansion task 9.2).
#
# Each entry is a TemplateVariant (TemplateVariantSchema): { id, base, scope,
# template }. `base` is a city-vienna article Document template (see
# documents/articles.yaml); the variant gives that article a second, closer
# register in the city's own voice. Resolution is city-then-era-then-base, so a
# city variant replaces its base article when rendered in Vienna (Req 8.2).
#
# SLOT-SET CONTRACT (Req 8.3): each variant's slot set equals its base's — every
# slot the base article declares, named once here, no more and no less. The
# comment above each variant lists the base's slots; a mismatch is a load error
# (CE-VARIANT).
#
# These give the city thirty Template Variants in all (seven over the core
# Document bases in core-variants.yaml, twenty-three here), the CE-QUANTITY
# target for a City Pack. Period voice: offices by title, no real names, no
# anachronisms.

# base: article-reconstruction-report
# slots: masthead, district, subject, detail, official-office
- id: v-reconstruction-report
  base: city-vienna/article-reconstruction-report
  scope: { city: vienna }
  template: >-
    {masthead}. In the {district} the work of rebuilding continues: {subject} is
    reported under way. {detail} The programme answers to the {official-office},
    and the coal stock for the winter is watched closely.

# base: article-ration-notice
# slots: masthead, period-label, ration-item, ration-detail, official-office
- id: v-ration-notice
  base: city-vienna/article-ration-notice
  scope: { city: vienna }
  template: >-
    {masthead}. The {official-office} announces the ration for {period-label}.
    The allowance of {ration-item} stands as follows: {ration-detail} Cards are
    presented in the holder's own Bezirk.

# base: article-tram-service
# slots: masthead, line, change-detail, effective-date, official-office
- id: v-tram-service
  base: city-vienna/article-tram-service
  scope: { city: vienna }
  template: >-
    {masthead}. From {effective-date} the {line} runs to an altered service.
    {change-detail} The change is published by the {official-office}; the last
    cars run before the Sperrstunde.

# base: article-weather-river
# slots: masthead, weather-detail, river-detail
- id: v-weather-river
  base: city-vienna/article-weather-river
  scope: { city: vienna }
  template: >-
    {masthead}. Over the Danube the outlook is this: {weather-detail} On the
    water, {river-detail} The ferries keep their times, fog permitting.

# base: article-sector-order
# slots: masthead, official-office, order-subject, effective-date, district
- id: v-sector-order
  base: city-vienna/article-sector-order
  scope: { city: vienna }
  template: >-
    {masthead}. By order of the {official-office}, from {effective-date}:
    {order-subject}. The order applies within the {district} and at its sector
    crossings, and is posted at the district office.

# base: article-court-record
# slots: masthead, offence, outcome, official-office
- id: v-court-record
  base: city-vienna/article-court-record
  scope: { city: vienna }
  template: >-
    {masthead}. Before the district court a charge of {offence} was heard.
    {outcome} The proceedings were reported by the {official-office}; the public
    gallery is open on weekday mornings.

# base: article-permit-notice
# slots: masthead, permit-subject, permit-detail, official-office, district
- id: v-permit-notice
  base: city-vienna/article-permit-notice
  scope: { city: vienna }
  template: >-
    {masthead}. The {official-office} gives notice on {permit-subject}.
    {permit-detail} Residents of the {district} apply in person, with proof of
    residence and two photographs.

# base: article-lost-found
# slots: masthead, found-item, place, official-office
- id: v-lost-found
  base: city-vienna/article-lost-found
  scope: { city: vienna }
  template: >-
    {masthead}. Handed in and unclaimed: {found-item}, left at {place}, now held
    by the {official-office}. Owners apply with proof of identity in office
    hours.

# base: article-market-prices
# slots: masthead, market-name, price-detail, shortage-note
- id: v-market-prices
  base: city-vienna/article-market-prices
  scope: { city: vienna }
  template: >-
    {masthead}. At the {market-name} the week's trade stood thus: {price-detail}
    {?shortage-note}A word of warning: {shortage-note}{/shortage-note}
    Controlled goods carry a fixed price off the stalls as on them.

# base: article-black-market-warning
# slots: masthead, goods, district, official-office
- id: v-black-market-warning
  base: city-vienna/article-black-market-warning
  scope: { city: vienna }
  template: >-
    {masthead}. The {official-office} warns against the illicit trade in
    {goods}, reported active in the {district}. Buyer and seller alike are
    liable; the public is asked to refuse the goods and report the traffic.

# base: article-business-notice
# slots: masthead, firm, business-detail, district
- id: v-business-notice
  base: city-vienna/article-business-notice
  scope: { city: vienna }
  template: >-
