#
# `kind: directory`. A commercial-and-trades directory of the kind sold or kept
# on a counter in the first postwar decade: an alphabetical classified list of
# trades with invented firm names and street addresses, plus the standing
# front-matter. The merged content loader ignores `public-texts/`; this record
# is validated only by PublicTextSchema and counted by the quantity rule. Every
# firm, person and address is fictional and generic; no real business is named.
# 40+ non-empty lines so the slice BOOK CIPHER has pages, lines and words.
