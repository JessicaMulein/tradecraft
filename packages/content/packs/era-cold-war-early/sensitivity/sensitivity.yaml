# sensitivity.yaml — the Sensitivity Term List for the early Cold War Era Pack.
#
# Validates against SensitivityTermSchema (packages/content/src/kinds/era.ts):
#   { term, pattern }
#
# This is the Sensitivity Term List: slurs and demeaning terms that shipped
# content MUST NOT contain. The linter's CE-SENSITIVE rule (task 5.3) rejects
# any Fact Line, document, NPC name, cover identity or template that matches a
# `pattern` here. The matcher tokenises with case and diacritic folding and
# skips template slots, so a plain lower-case fragment is enough; the `term`
# names the category for the reviewer, and the `pattern` is the surface the
# matcher scans.
#
# The entries fall into three groups:
#   1. Ethnic, national and racial slurs. The period setting — occupied Europe,
#      divided cities, waves of refugees and émigrés — makes it tempting to
#      reach for period-authentic abuse. The game does not. NPCs of every
#      culture are named and described with dignity; prejudice may be a
#      character's trait, but it is never rendered in slurs.
#   2. Demeaning terms for religion, disability, sexuality and gender. These are
#      excluded regardless of period "authenticity".
#   3. Dehumanising and atrocity-trivialising language. The war's immediate
#      aftermath is the backdrop; the game treats displacement, loss and
#      atrocity with restraint (see the Style Guide's aftermath-restraint rule)
#      and never with slang that trivialises them.
#
# NOTE ON PATTERNS: the patterns below are deliberately written as the specific
# abusive surface forms the matcher must catch. They are listed here ONLY so the
# linter can forbid them in generated and authored content — this file is the
# exclusion list, the one place these forms are enumerated so they appear
# nowhere else. Neutral descriptive words (a person's nationality, religion or
# the plain name of a group) are NOT listed: those are the correct, respectful
# terms the content uses.

# =========================================================================
# ETHNIC, NATIONAL & RACIAL SLURS
# =========================================================================
# The patterns are the demeaning forms. The respectful terms — German, Russian,
# Austrian, Turkish, Greek, Armenian, Jewish, Roma, and so on — are used freely
# in content and are not listed here.

- term: anti-German slur (occupation-era abuse)
  pattern: kraut

- term: anti-German slur (occupation-era abuse)
  pattern: jerry-bashing

- term: anti-German slur (occupation-era abuse)
  pattern: hun

