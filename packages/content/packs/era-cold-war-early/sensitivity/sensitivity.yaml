# =========================================================================
# DEHUMANISING & ATROCITY-TRIVIALISING LANGUAGE
# =========================================================================
# The aftermath of the war is backdrop, not spectacle. These forms treat
# displacement, forced labour, imprisonment and mass death as slang or boast and
# are excluded. Neutral terms — refugee, displaced person, survivor, prisoner,
# the dead — are the respectful words the content uses.

- term: dehumanising term for refugees / displaced persons
  pattern: refugee vermin

- term: dehumanising term for displaced persons
  pattern: human cargo

- term: dehumanising term for a person (sub-human)
  pattern: subhuman

- term: dehumanising ethnic-cleansing euphemism
  pattern: cleanse the quarter

- term: atrocity-trivialising slang
  pattern: send them up the chimney

- term: atrocity-trivialising slang
  pattern: liquidate the lot

- term: atrocity-trivialising boast
  pattern: finish the job on them

- term: dehumanising term for prisoners
  pattern: cattle for the camps
