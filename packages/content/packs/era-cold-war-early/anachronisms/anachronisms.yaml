# =========================================================================
# BERLIN — city-scoped border apparatus (period-correct only from 1961)
# =========================================================================
#
# These terms name the Berlin Wall and its border machinery, raised in August
# 1961. For a Berlin scenario set before 1961 they are anachronisms; for one set
# in 1962 and after they are period-correct. They are scoped to the Berlin city
# id so the anachronism rule applies them only to Berlin content. The sector
# border before 1961 was an open, policed line, not a wall.

- term: the Berlin Wall
  pattern: berlin wall
  earliest: 1961
  city: city-berlin/berlin
  note: >-
    The Wall was raised in August 1961. A Berlin document set before 1961 names
    the open sector boundary, not a wall.

- term: the Wall (Berlin)
  pattern: the wall
  earliest: 1961
  city: city-berlin/berlin
  note: >-
    "The Wall" as the sector barrier is period-correct in Berlin only from 1961.
    Before then the sector line was crossed freely on foot and by U-Bahn.

- term: Checkpoint Charlie
  pattern: checkpoint charlie
  earliest: 1961
  city: city-berlin/berlin
  note: >-
    The named Allied crossing point dates from the August 1961 border closure.
    Out of period for a Berlin scenario set before 1961.

- term: death strip
  pattern: death strip
  earliest: 1961
  city: city-berlin/berlin
  note: >-
    The cleared, mined border zone belongs to the Wall era from 1961. An
    anachronism for earlier Berlin content.

- term: border fortifications (Berlin inner)
  pattern: border fortifications
  earliest: 1961
  city: city-berlin/berlin
  note: >-
    The fortified inner-city border is a post-1961 feature. Before then the
    sector boundary was marked by signs and patrols.

- term: anti-fascist protection rampart
  pattern: protection rampart
  earliest: 1961
  city: city-berlin/berlin
  note: >-
    The official eastern name for the Wall dates from 1961. Out of period for
    earlier Berlin content.

- term: no man's land (Berlin wall)
  pattern: no man's land strip
  earliest: 1961
  city: city-berlin/berlin
  note: >-
    The cleared strip between the two walls is a post-1961 feature of Berlin.
    An anachronism for earlier Berlin content.

- term: watchtower line (Berlin)
  pattern: border watchtower
  earliest: 1961
  city: city-berlin/berlin
  note: >-
    The line of border watchtowers belongs to the Wall era from 1961. Out of
    period for earlier Berlin content.

- term: Wall crossing permit
  pattern: wall crossing permit
  earliest: 1961
  city: city-berlin/berlin
  note: >-
    Formal crossing permits for the walled border date from 1961. Before then
    movement between sectors was largely unrestricted.

- term: sealed sector border (Berlin)
  pattern: sealed sector border
  earliest: 1961
  city: city-berlin/berlin
  note: >-
    The sector border was sealed in August 1961. A Berlin document set before
    then describes an open, if policed, boundary.

