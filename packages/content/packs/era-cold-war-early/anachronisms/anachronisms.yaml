# anachronisms.yaml — the Anachronism Entry list for the early Cold War, 1945–1965.
#
# Validates against AnachronismEntrySchema (packages/content/src/kinds/era.ts):
#   { term, pattern, earliest: number, city?: CityId, note }
#
# Each entry names a term that would be anachronistic in a 1945–1965 document.
# `earliest` is the first year the term is period-correct — the linter's
# CE-ANACH rule (task 5.4) flags any text that uses the term before that year
# for the Game Year. `pattern` is the surface the text matcher scans; it is a
# case-insensitive word/phrase fragment (the linter tokenises with diacritic
# and case folding and skips template slots, so plain lower-case forms suffice).
# `note` records why the term is out of period, for the reviewer.
#
# Most entries carry an `earliest` later than 1965: the term simply does not
# belong in a game whose Period Window ends in 1965, so any use is an
# anachronism. A handful name things that entered common use *within* the window
# (the transistor radio, the long-playing record, the hovercraft) with the year
# they did, so a 1946 document is flagged but a 1960 one is not.
#
# City-scoped entries carry a `city` id. These are terms that only became
# anachronistic in a particular city — most importantly the Berlin border
# apparatus of 1961 and after (the Wall, Checkpoint Charlie, the death strip),
# which is period-correct for a Berlin scenario set in 1962 but an anachronism
# for one set in 1959. The Berlin city id is `city-berlin/berlin` (task 9.3).
#
# EVERY NAME IS FICTIONAL where a brand would be implied; generic nouns are used
# for the technology itself. No real trademark is asserted.

