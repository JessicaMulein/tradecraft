# blocklist.yaml — the Real-Person Blocklist for the early Cold War, 1945–1965.
#
# Validates against BlocklistEntrySchema (packages/content/src/kinds/era.ts):
#   { name, familyOnly?: boolean, note }
#
# This is the Real-Person Blocklist: notable real individuals of the period
# whose names NO generated NPC name, authored character, cover identity, service
# name or document text may use. The linter's CE-REALPERSON rule (task 5.3)
# rejects any content that matches an entry, and the generator's `nameNpc`
# redraws a drawn name that is blocklisted (task 3.4). The point of this list is
# EXCLUSION: these real people appear here so that the game's fiction never
# accidentally puts words in a real statesman's, officer's or author's mouth, or
# names a fictional agent after one. All people and organisations named in the
# shipped packs are fictional; this list is how that invariant is enforced.
#
# `familyOnly: true` marks an entry whose family name alone is distinctive
# enough that the surname by itself must be rejected (for example a head of
# government whose surname is unmistakable). An entry without `familyOnly` is
# matched on the full name; a common given name on its own is not blocked, so
# ordinary period first names remain available to the namer.
#
# The list covers the heads of state and government, foreign ministers, senior
# military and intelligence figures, and the most prominent scientists, writers
# and public figures a 1945–1965 European document might brush against. It is a
# review aid, not an exhaustive census; a reviewer adds any further real name a
# draft happens to collide with.

