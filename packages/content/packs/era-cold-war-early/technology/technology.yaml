# technology.yaml — Technology Items for the early Cold War, 1945–1965.
#
# Validates against TechnologyItemSchema (packages/content/src/kinds/era.ts):
#   { id, name, aliases: string[], category, introduced: number, tags: TagId[] }
#
# Each item carries the year it became available to an ordinary person in a
# European city (`introduced`), which the linter's CE-ANACH rule checks: a
# document that names an item before its `introduced` year is an anachronism
# (task 5.4). `aliases` give the other surface forms the text matcher scans
# (brand-free generic names, period slang, abbreviations). Every brand name is
# invented so no real trademark is implied; where a thing is generic (a tape
# recorder, a biro) the plain noun is used.
#
# `tags` is left empty: the core Tag Vocabulary's `item` facet ships no `item:*`
# Tag yet, and `technology` is not a kind the vocabulary requires to be tagged,
# so an empty list loads cleanly. A later task that adds `item:*` Tags can place
# these items in the vocabulary.
#
# Introduced years are deliberately conservative — the year the item was in
# common European civilian use, not the year of its first laboratory prototype —
# so the anachronism rule stays period-correct for a 1945–1965 game.

