  voiceTraits:
    - fluent across tongues, charming and watchful
    - makes commerce of conversation and conversation of commerce
    - veils a hard bargain in generous courtesy
    - names no faction and keeps counsel with all
    - closes an awkward turn with a proverb and a smile
  mannerisms:
    - pours coffee for the guest's cup before his own
    - clasps the forearm in a warm greeting
    - lets the silence after an offer stretch deliberately
    - fingers a string of amber beads while talking
    - sees a visitor to the gate and waits until he turns the corner
  backgrounds:
    - text: Keeps an import office on the quay and brokers goods across the sea.
      tags: []
    - text: Clerks for a French bank and keeps correspondence in three languages.
      tags: []
    - text: Runs a hotel in the mixed quarter where every passport is welcome.
      tags: []
    - text: Trades in silk and olive oil and settles accounts in gold when the lira slips.
      tags: []
    - text: Interprets at a consulate and carries word between the merchant houses.
      tags: []
    - text: Teaches at a mission college and reads the papers of four capitals.
      tags: []
    - text: Keeps a pharmacy on the corniche and the quarter's quiet confidences.
      tags: []
    - text: Deals in antiquities and knows which collectors prefer no paperwork.
      tags: []
    - text: Manages a shipping agent's books and the manifests the agent would rather lose.
      tags: []
    - text: Came from the mountain villages to the port and kept the old caution.
      tags: []
    - text: Keeps a money-changer's window and knows the rates before the banks post them.
      tags: []
    - text: Runs a coffeehouse where the rival committees each keep a table.
      tags: []
    - text: Owns a cinema on the avenue and lets the back office to anyone discreet.
      tags: []
    - text: Clerks at the port and knows which cargoes travel under a false bill.
      tags: []
    - text: Keeps a tailor's shop that fits the consuls and overhears their fittings.
      tags: []
    - text: Edits a small French-language weekly and prints only what keeps it open.
      tags: []
