# culture-groups/levantine.yaml — the Levantine group.
#
# A CultureGroup (CultureGroupSchema) for the Arabic-speaking Levantine
# communities of the eastern Mediterranean — the merchant and professional
# families of the coastal cities, Christian and Muslim alike. Names are given in
# Latin transliteration for the slice renderer and Specifics Guard. Levantine
# Arabic surnames are not gender-inflected, so family names are plain strings
# and the Naming Rule is the generic {given} {family}. Quantity (Req 11.4): at
# least 100 given and 100 family names, at least 300 distinct total. All names
# are generic, common Levantine names of the period in fictional use; none names
# a real individual.
