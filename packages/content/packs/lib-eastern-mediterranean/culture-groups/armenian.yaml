  voiceTraits:
    - warm and formal at once, honouring old courtesies
    - speaks of the past carefully and the present more so
    - threads commerce and family into every account
    - gauges a stranger with patient, deliberate questions
    - keeps grief private and generosity public
  mannerisms:
    - presses a second helping on any guest
    - folds hands and inclines the head in greeting
    - keeps a photograph of the old country on the counter
    - taps the table once to seal an agreement
    - sees a visitor to the street every time
  backgrounds:
    - text: Keeps a jeweller's bench in the arcade and works for the whole quarter.
      tags: []
    - text: Runs a photographic studio and knows which faces prefer not to be filed.
      tags: []
    - text: Imports watch parts and precision tools through a tangle of agents.
      tags: []
    - text: Clerks at a trading house and keeps the correspondence in three scripts.
      tags: []
    - text: Teaches at the community school and tends its small, careful library.
      tags: []
    - text: Mends and sells carpets and reads a buyer before a word is spoken.
      tags: []
    - text: Keeps a pharmacy on the avenue and the confidences that come with it.
      tags: []
    - text: Settled from the provinces after the hard years and speaks little of them.
      tags: []
      years: { from: 1945, to: 1960 }
    - text: Tunes pianos for the hotels and hears what the salons say over the keys.
      tags: []
    - text: Keeps the books for a tobacco merchant and the merchant's quiet partners.
      tags: []
    - text: Runs a shoe shop in the arcade and resoles for half the civil service.
      tags: []
    - text: Deals in gold and small gems and keeps no ledger a stranger could read.
      tags: []
    - text: Prints and binds for the community and quietly for anyone who pays.
      tags: []
    - text: Keeps a dental surgery the consulates send their staff to.
      tags: []
    - text: Trades spices and dried fruit and crosses frontiers on an old merchant's papers.
      tags: []
    - text: Tends the parish accounts and the names in its registers besides.
      tags: []
