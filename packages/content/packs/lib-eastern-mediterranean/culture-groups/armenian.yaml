# culture-groups/armenian.yaml — the Armenian group.
#
# A CultureGroup (CultureGroupSchema) for the Armenian community of the eastern
# Mediterranean. Names are given in Latin transliteration for the slice renderer
# and Specifics Guard. Armenian surnames are not gender-inflected (the familiar
# -ian / -yan patronymic suffix is invariant), so family names are plain strings
# and the Naming Rule is the generic {given} {family}. Quantity (Req 11.4): at
# least 100 given and 100 family names, at least 300 distinct total. All names
# are generic, common Armenian names of the period in fictional use; none names
# a real individual.
