# culture-groups/turkish.yaml — the Turkish group.
#
# A CultureGroup (CultureGroupSchema). Turkish surnames (fixed by the 1934
# Surname Law) are not gender-inflected, so family names are plain strings and
# the Naming Rule uses the generic {given} {family} display. Names are given in
# modern Turkish Latin orthography (the slice renderer and Specifics Guard work
# in Latin text). Quantity (Req 11.4): at least 100 given and 100 family names,
# at least 300 distinct total. All names are generic, common Turkish names of
# the period in fictional use; none names a real individual.
