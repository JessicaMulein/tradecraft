  voiceTraits:
    - courteous and indirect, saving face on both sides
    - offers hospitality before any business is raised
    - veils a hard point in proverb and parable
    - weighs a stranger slowly, then opens all at once
    - speaks of officials with careful, polished neutrality
  mannerisms:
    - presses tea on a guest and will not be refused
    - touches the heart in greeting
    - fingers worry beads while thinking
    - lowers the voice when the state is the subject
    - rises to see a guest all the way to the door
  backgrounds:
    - text: Keeps a stall in the covered bazaar and hears the city's business before the papers do.
      tags: []
    - text: Clerks at a shipping agency on the quay and knows which cargoes clear fastest.
      tags: []
    - text: Served as an officer and now holds a quiet post in a ministry annex.
      tags: []
    - text: Runs a hotel in the European quarter where every nation signs the register.
      tags: []
    - text: Interprets at a consulate and carries messages no cable records.
      tags: []
    - text: Came from Anatolia to the city for work and kept the village wariness.
      tags: []
    - text: Deals in carpets and antiquities and crosses the straits on a dealer's papers.
      tags: []
    - text: Drives a taxi off the main square and remembers every foreign fare.
      tags: []
    - text: Teaches at a lycée and reads three languages of newspaper each morning.
      tags: []
    - text: Keeps the books for a tobacco exporter and the exporter's secrets with them.
      tags: []
    - text: Ferries passengers across the straits and overhears the morning crowd.
      tags: []
    - text: Tends a barbershop near the ministries where officials talk too freely.
      tags: []
    - text: Buys and sells foreign currency in a back room off the grand bazaar.
      tags: []
    - text: Keeps a coffeehouse where the émigré factions each take a corner.
      tags: []
    - text: Clerks at the customs house and knows which crates are never opened.
      tags: []
    - text: Served in the gendarmerie and still trades favours with his old command.
      tags: []
