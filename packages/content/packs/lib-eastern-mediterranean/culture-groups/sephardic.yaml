# culture-groups/sephardic.yaml — the Sephardic (Ladino-speaking) group.
#
# A CultureGroup (CultureGroupSchema) for the Judeo-Spanish (Ladino-speaking)
# Sephardic community of the eastern Mediterranean — Istanbul, Salonica and the
# wider Levant. Names are given in Latin transliteration for the slice renderer
# and Specifics Guard. Sephardic surnames are not gender-inflected, so family
# names are plain strings and the Naming Rule is the generic {given} {family}.
# Quantity (Req 11.4): at least 100 given and 100 family names, at least 300
# distinct total. All names are generic, common names of the community in
# fictional use; none names a real individual.
