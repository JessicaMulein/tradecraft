  voiceTraits:
    - old-world courteous, laced with Ladino proverbs
    - weighs words as carefully as coin
    - treads lightly around anything the state might hear
    - warms to a shared language or a shared town
    - softens hard news with a blessing
  mannerisms:
    - blesses the house before raising business
    - counts stock twice out of long habit
    - drops a Ladino refrain to close a bargain
    - keeps the shop ledger in a locked drawer
    - touches the doorpost on the way out
  backgrounds:
    - text: Keeps a textile shop in the market and trades across three borders by letter.
      tags: []
    - text: Clerks for a trading house and keeps the correspondence in Ladino and French.
      tags: []
    - text: Deals in haberdashery and knows which suppliers take payment in gold.
      tags: []
    - text: Teaches at the community school and tends its old prayer books.
      tags: []
    - text: Keeps the accounts for a tobacco exporter and the family's older debts.
      tags: []
    - text: Mends watches in a stall by the gate and hears the quarter's business.
      tags: []
    - text: Settled in the city after the war scattered the old community.
      tags: []
      years: { from: 1945, to: 1960 }
    - text: Imports thread and buttons and settles accounts in whatever currency holds.
      tags: []
    - text: Runs a small lending counter the merchants trust and the police watch.
      tags: []
    - text: Interprets at the exchange and carries news between the merchant houses.
      tags: []
    - text: Keeps a stall of silks and remnants that supplies the quarter's tailors.
      tags: []
    - text: Trades in coffee and spices and settles with partners in three ports.
      tags: []
    - text: Runs a printing house that sets Ladino, French and the local script.
      tags: []
    - text: Keeps a pawnshop the hard-up gentry visit by the side door.
      tags: []
    - text: Deals in cloth of gold and knows which brides' families still pay in coin.
      tags: []
    - text: Clerks for a grain merchant and reads the sailings before the broker does.
      tags: []
