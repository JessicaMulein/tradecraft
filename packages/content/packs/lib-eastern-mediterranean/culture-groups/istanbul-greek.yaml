# culture-groups/istanbul-greek.yaml — the Istanbul Greek (Rum) group.
#
# A CultureGroup (CultureGroupSchema) for the Greek Orthodox community of
# Istanbul (the Rum Polites). Names are given in Latin transliteration for the
# slice renderer and Specifics Guard. Greek surnames do inflect in native use,
# but the transliterated nominative form is used here as a single plain string,
# so family names are plain strings and the Naming Rule is the generic
# {given} {family}. Quantity (Req 11.4): at least 100 given and 100 family
# names, at least 300 distinct total. All names are generic, common names of the
# community in fictional use; none names a real individual.
