  voiceTraits:
    - cosmopolitan and quick, switching tongue to suit the table
    - fences a point with Levantine irony
    - keeps old-world courtesy over a trader's wariness
    - speaks of community matters in guarded shorthand
    - laughs easily and gives away little
  mannerisms:
    - counts worry beads through a long story
    - orders coffee for the whole table without asking
    - taps a cigarette twice before lighting it
    - gestures with the coffee cup to make a point
    - lowers the voice to name an official
  backgrounds:
    - text: Keeps a dry-goods shop in Pera that has served the quarter three generations.
      tags: []
    - text: Clerks for a maritime insurer and knows which hulls were overvalued.
      tags: []
    - text: Teaches at a community school and keeps the parish registers besides.
      tags: []
    - text: Trades in tobacco and currants and settles accounts in four currencies.
      tags: []
    - text: Runs a patisserie on the grand avenue where consuls take their afternoons.
      tags: []
    - text: Interprets at the exchange and hears every rumour before it is a price.
      tags: []
    - text: Keeps the books for a shipping house and the family's older ledgers too.
      tags: []
    - text: Cantors at the parish church and carries messages between households.
      tags: []
    - text: Deals in antiquities and knows which buyers never ask for papers.
      tags: []
    - text: Tends bar at a hotel on the water and remembers every late conversation.
      tags: []
    - text: Keeps a chandlery on the Galata quay and supplies half the small craft.
      tags: []
    - text: Runs a printing shop that sets type in three alphabets for the quarter.
      tags: []
    - text: Clerks for a cotton broker and keeps the ledgers in Greek and French.
      tags: []
    - text: Manages a cinema in Pera and knows which back rows the deals are struck in.
      tags: []
    - text: Keeps a pharmacy by the church and the quarter's quiet troubles with it.
      tags: []
    - text: Trades carpets along the arcade and reads a buyer before a word is spoken.
      tags: []
