# region-core (multi-city task 1.3, Req 16.3, 16.6).
#
# One playable region template, central-1953: Vienna is the hub, with Berlin
# and Trieste. The era date 1953-06-01 lies inside Vienna 1945-1955, Berlin
# 1948-1961 and Trieste 1947-1954. Cities, services and districts come from
# the content-expansion city packs this pack requires.
id: region-core
version: 1.0.0
contentSchema: 2
role: extension
requires:
  - id: city-vienna
    range: '^1.0.0'
  - id: city-berlin
    range: '^1.0.0'
  - id: city-trieste
    range: '^1.0.0'
overrides: []
