- id: the-affair
  templateSchema: 2
  kind: side-thread
  displayName: the-affair
  archetype: kompromat
  era:
    from: 1948
    to: 1962
  minPreset: easy
  subOnly: false
  selection:
    weight: 1
  concurrency:
    tags: []
    allowWith: []
  params:
    venue:
      kind: loc
      query:
        - function:cafe
      mandatory: false
      fallback:
        - function:cafe
  roleSlots:
    witness:
      query:
        - role:civilian
  cells: []
  stages:
    - id: seen
      requires: []
      deadline:
        min: 6
        max: 12
      traces:
        - kind: meeting
          roles:
            - witness
          place:
            query:
              - function:cafe
          evidences:
            - LOCATED_AT
          text: A couple takes a room for an hour and one of them arrives by the back stair.
        - kind: transmission
          channel: radio
          evidences:
            - LOCATED_AT
          text: A call gives the room number and which of them used the back stair.
      onDisrupted:
        delay: 0.5
        reroute: 0.4
        abort: 0.1
  stageCount:
    min: 1
    max: 2
  outcomes:
    success: []
    failure:
      - kind: stage-completed
        stage: seen
  spawn:
    - worldgen
  mimics: kompromat
