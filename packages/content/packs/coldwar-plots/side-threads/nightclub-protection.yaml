- id: nightclub-protection
  templateSchema: 2
  kind: side-thread
  displayName: nightclub-protection
  archetype: private
  era:
    from: 1948
    to: 1962
  minPreset: easy
  subOnly: false
  selection:
    weight: 1
  concurrency:
    tags: []
    allowWith: []
  params:
    venue:
      kind: loc
      query:
        - function:cafe
      mandatory: false
      fallback:
        - function:cafe
  roleSlots:
    witness:
      query:
        - role:civilian
  cells: []
  stages:
    - id: seen
      requires: []
      deadline:
        min: 6
        max: 12
      traces:
        - kind: meeting
          roles:
            - witness
          place:
            query:
              - function:cafe
          evidences:
            - LOCATED_AT
          text: A doorman takes an envelope and does not put it in the till.
        - kind: transmission
          channel: radio
          evidences:
            - LOCATED_AT
          text: A call confirms the envelope reached the man who does not appear on the payroll.
      onDisrupted:
        delay: 0.5
        reroute: 0.4
        abort: 0.1
  stageCount:
    min: 1
    max: 2
  outcomes:
    success: []
    failure:
      - kind: stage-completed
        stage: seen
  ambient:
    spawn:
      metric: festivity
      above: 0.18
      tags: [festival]
  spawn:
    - worldgen
    - midgame
