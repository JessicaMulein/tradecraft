- id: journalist-story
  templateSchema: 2
  kind: side-thread
  displayName: journalist-story
  archetype: document-theft
  era:
    from: 1948
    to: 1962
  minPreset: easy
  subOnly: false
  selection:
    weight: 1
  concurrency:
    tags: []
    allowWith: []
  params:
    venue:
      kind: loc
      query:
        - function:cafe
      mandatory: false
      fallback:
        - function:cafe
  roleSlots:
    witness:
      query:
        - role:civilian
  cells: []
  stages:
    - id: seen
      requires: []
      deadline:
        min: 6
        max: 12
      traces:
        - kind: meeting
          roles:
            - witness
          place:
            query:
              - function:cafe
          evidences:
            - LOCATED_AT
          text: A reporter buys a drink for a clerk and asks about a file by its number.
        - kind: transmission
          channel: radio
          evidences:
            - LOCATED_AT
          text: A call repeats a file number the reporter should not have had.
      onDisrupted:
        delay: 0.5
        reroute: 0.4
        abort: 0.1
  stageCount:
    min: 1
    max: 2
  outcomes:
    success: []
    failure:
      - kind: stage-completed
        stage: seen
  ambient:
    spawn:
      metric: police
      above: 0.36
      tags: [crackdown]
  spawn:
    - worldgen
    - midgame
  mimics: document-theft
