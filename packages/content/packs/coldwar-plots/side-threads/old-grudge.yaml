- id: old-grudge
  templateSchema: 2
  kind: side-thread
  displayName: old-grudge
  archetype: assassination
  era:
    from: 1948
    to: 1962
  minPreset: easy
  subOnly: false
  selection:
    weight: 1
  concurrency:
    tags: []
    allowWith: []
  params:
    venue:
      kind: loc
      query:
        - function:cafe
      mandatory: false
      fallback:
        - function:cafe
  roleSlots:
    witness:
      query:
        - role:civilian
  cells: []
  stages:
    - id: seen
      requires: []
      deadline:
        min: 6
        max: 12
      traces:
        - kind: meeting
          roles:
            - witness
          place:
            query:
              - function:cafe
          evidences:
            - LOCATED_AT
          text: Two men who should not know each other share a bottle and do not toast.
        - kind: transmission
          channel: radio
          evidences:
            - LOCATED_AT
          text: A call says the two men met and neither used the other’s name.
      onDisrupted:
        delay: 0.5
        reroute: 0.4
        abort: 0.1
  stageCount:
    min: 1
    max: 2
  outcomes:
    success: []
    failure:
      - kind: stage-completed
        stage: seen
  spawn:
    - worldgen
  mimics: assassination
