- id: hall-of-mirrors
  templateSchema: 2
  kind: plot
  displayName: Hall of mirrors
  archetype: document-theft
  era:
    from: 1948
    to: 1962
  minPreset: easy
  subOnly: false
  selection:
    weight: 1
  concurrency:
    tags:
      - document-theft
    allowWith:
      - sabotage
      - kompromat
      - smuggling
      - forgery
      - recruitment
      - assassination
      - mole-hunt
      - abduction
      - exfiltration
      - dangle
      - border
      - penetration
  params:
    pouch:
      kind: item
      query:
        - materiel:document
  roleSlots:
    leader:
      query:
        - role:cell
    courier:
      query:
        - role:cell
  cells:
    - id: action
      roles:
        - leader
        - courier
  cutouts: []
  stages:
    - id: facade-meet
      requires: []
      deadline:
        min: 12
        max: 20
      traces:
        - kind: meeting
          roles:
            - leader
          place:
            query:
              - function:cafe
          evidences:
            - LOCATED_AT
            - MEETS_AT
          text: The meeting everyone can see is about a contract that does not exist.
        - kind: transmission
          channel: radio
          evidences:
            - LOCATED_AT
          text: The visible meeting is reported as if it were the real one.
      onDisrupted: &a1
        delay: 0.5
        reroute: 0.4
        abort: 0.1
    - id: confirm
      requires:
        - facade-meet
      deadline:
        min: 6
        max: 10
      traces:
        - kind: meeting
          roles:
            - leader
            - courier
          place:
            query:
              - function:cafe
          evidences:
            - LOCATED_AT
            - MEETS_AT
          text: A second meeting on the hall of mirrors is kept short, and the two leave by different doors.
        - kind: transmission
          channel: radio
          evidences:
            - LOCATED_AT
            - MEETS_AT
          text: The follow-up call for the hall of mirrors repeats the meeting and names both people.
      onDisrupted: *a1
    - id: real-pass
      requires:
        - confirm
      deadline:
        min: 14
        max: 22
      traces:
        - kind: meeting
          roles:
            - courier
          place:
            query:
              - function:cafe
          evidences:
            - LOCATED_AT
            - MEETS_AT
          text: A second meeting, ten minutes later, is the one that matters.
        - kind: transmission
          channel: radio
          evidences:
            - LOCATED_AT
          text: A second call, on another frequency, names the document that actually moved.
      onDisrupted: *a1
  stageCount:
    min: 2
    max: 6
  outcomes:
    success:
      - kind: seize-item
        item: pouch
      - kind: arrest-role
        role: courier
    failure:
      - kind: stage-completed
        stage: real-pass
  twist:
    kind: facade
    mandatory: true
    facadeStages:
      - confirm
    facadeTraceRate: 1.6
    propositions:
      - predicate: REPORTS_TO
        subject: role:leader
        object: org:hostile
