- id: machine-tools
  templateSchema: 2
  kind: plot
  displayName: Machine tools
  archetype: materiel-smuggling
  era:
    from: 1948
    to: 1962
  minPreset: easy
  subOnly: false
  selection:
    weight: 1
  concurrency:
    tags:
      - smuggling
    allowWith:
      - sabotage
      - kompromat
      - document-theft
      - forgery
      - recruitment
      - assassination
      - mole-hunt
      - abduction
      - exfiltration
      - dangle
      - border
      - penetration
  params:
    yard:
      kind: loc
      query:
        - function:warehouse
    shipment:
      kind: item
      query:
        - materiel:explosive
  roleSlots:
    leader:
      query:
        - role:cell
    buyer:
      query:
        - role:cell
    courier:
      query:
        - role:cell
  cells:
    - id: buyers
      roles:
        - buyer
    - id: shippers
      roles:
        - leader
  cutouts:
    - role: courier
      links:
        - buyers
        - shippers
  stages:
    - id: buy
      requires: []
      deadline:
        min: 12
        max: 20
      traces:
        - kind: meeting
          roles:
            - buyer
          place:
            query:
              - function:cafe
          evidences:
            - LOCATED_AT
            - MEETS_AT
          text: A buyer asks for a lathe that no civilian shop in the city stocks.
        - kind: transmission
          channel: radio
          evidences:
            - LOCATED_AT
          text: A call gives the serial prefix the buyer was told to ask for.
      onDisrupted: &a1
        delay: 0.5
        reroute: 0.4
        abort: 0.1
    - id: confirm
      requires:
        - buy
      deadline:
        min: 6
        max: 10
      traces:
        - kind: meeting
          roles:
            - leader
            - courier
          place:
            query:
              - function:cafe
          evidences:
            - LOCATED_AT
            - MEETS_AT
          text: A second meeting on the machine tools is kept short, and the two leave by different doors.
        - kind: transmission
          channel: radio
          evidences:
            - LOCATED_AT
            - MEETS_AT
          text: The follow-up call for the machine tools repeats the meeting and names both people.
      onDisrupted: *a1
    - id: ship
      requires:
        - confirm
      deadline:
        min: 14
        max: 22
      traces:
        - kind: meeting
          roles:
            - courier
          place:
            query:
              - function:cafe
          evidences:
            - LOCATED_AT
            - MEETS_AT
          text: Crates labelled spare parts are heavier on one side.
        - kind: transmission
          channel: radio
          evidences:
            - LOCATED_AT
          text: The crate is confirmed on the lorry, still labelled spare parts.
      onDisrupted: *a1
  stageCount:
    min: 2
    max: 6
  outcomes:
    success:
      - kind: seize-item
        item: shipment
    failure:
      - kind: stage-completed
        stage: ship
  secondary:
    standingPenalty: 3
    standingReward: 2
    damageReport: Headquarters reports damage from a second operation.
