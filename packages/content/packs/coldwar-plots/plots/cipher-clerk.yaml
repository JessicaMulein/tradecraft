- id: cipher-clerk
  templateSchema: 2
  kind: plot
  displayName: Cipher clerk
  archetype: document-theft
  era:
    from: 1948
    to: 1962
  minPreset: easy
  subOnly: false
  selection:
    weight: 1
  concurrency:
    tags:
      - document-theft
    allowWith:
      - sabotage
      - kompromat
      - smuggling
      - forgery
      - recruitment
      - assassination
      - mole-hunt
      - abduction
      - exfiltration
      - dangle
      - border
      - penetration
  params:
    office:
      kind: loc
      query:
        - function:embassy
    pouch:
      kind: item
      query:
        - materiel:document
  roleSlots:
    leader:
      query:
        - role:cell
    courier:
      query:
        - role:cell
  cells:
    - id: action
      roles:
        - leader
        - courier
  cutouts: []
  stages:
    - id: copy
      requires: []
      deadline:
        min: 12
        max: 20
      traces:
        - kind: meeting
          roles:
            - leader
          place:
            query:
              - function:cafe
          evidences:
            - LOCATED_AT
            - MEETS_AT
          text: A clerk stays late with the safe open and a pencil behind his ear.
        - kind: transmission
          channel: radio
          evidences:
            - LOCATED_AT
          text: A short transmission is nothing but a page count.
      onDisrupted: &a1
        delay: 0.5
        reroute: 0.4
        abort: 0.1
    - id: confirm
      requires:
        - copy
      deadline:
        min: 6
        max: 10
      traces:
        - kind: meeting
          roles:
            - leader
            - courier
          place:
            query:
              - function:cafe
          evidences:
            - LOCATED_AT
            - MEETS_AT
          text: A second meeting on the cipher clerk is kept short, and the two leave by different doors.
        - kind: transmission
          channel: radio
          evidences:
            - LOCATED_AT
            - MEETS_AT
          text: The follow-up call for the cipher clerk repeats the meeting and names both people.
      onDisrupted: *a1
    - id: pass
      requires:
        - confirm
      deadline:
        min: 14
        max: 22
      traces:
        - kind: meeting
          roles:
            - courier
          place:
            query:
              - function:cafe
          evidences:
            - LOCATED_AT
            - MEETS_AT
          text: A folded square of paper moves from the clerk to a man who does not work in the building.
        - kind: transmission
          channel: radio
          evidences:
            - LOCATED_AT
          text: The recipient confirms the square of paper arrived and was burned.
      onDisrupted: *a1
    - subplot:
        template: courier-relay
        as: relay
        map:
          pouch: courier
  stageCount:
    min: 2
    max: 6
  outcomes:
    success:
      - kind: seize-item
        item: pouch
      - kind: arrest-role
        role: courier
    failure:
      - kind: stage-completed
        stage: pass
  secondary:
    standingPenalty: 3
    standingReward: 2
    damageReport: Headquarters reports damage from a second operation.
