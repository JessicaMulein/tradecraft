- id: courier-relay
  templateSchema: 2
  kind: plot
  displayName: courier-relay
  archetype: support
  era:
    from: 1948
    to: 1962
  minPreset: easy
  subOnly: true
  selection:
    weight: 1
  concurrency:
    tags:
      - exfiltration
    allowWith:
      - sabotage
      - kompromat
      - smuggling
      - document-theft
      - forgery
      - recruitment
      - assassination
      - mole-hunt
      - abduction
      - dangle
      - border
      - penetration
  params:
    venue:
      kind: loc
      query:
        - function:cafe
  roleSlots:
    leader:
      query:
        - role:cell
    courier:
      query:
        - role:cell
  cells:
    - id: action
      roles:
        - leader
        - courier
  cutouts: []
  stages:
    - id: begin
      requires: []
      deadline:
        min: 12
        max: 20
      traces:
        - kind: meeting
          roles:
            - leader
          place:
            query:
              - function:cafe
          evidences:
            - LOCATED_AT
            - MEETS_AT
          text: A pouch moves through a chain of hands.
        - kind: transmission
          channel: radio
          evidences:
            - LOCATED_AT
          text: A call names the third tram and the man with the grey hat.
      onDisrupted: &a1
        delay: 0.5
        reroute: 0.4
        abort: 0.1
    - id: confirm
      requires:
        - begin
      deadline:
        min: 6
        max: 10
      traces:
        - kind: meeting
          roles:
            - leader
            - courier
          place:
            query:
              - function:cafe
          evidences:
            - LOCATED_AT
            - MEETS_AT
          text: A second meeting on the courier relay is kept short, and the two leave by different doors.
        - kind: transmission
          channel: radio
          evidences:
            - LOCATED_AT
            - MEETS_AT
          text: The follow-up call for the courier relay repeats the meeting and names both people.
      onDisrupted: *a1
    - id: finish
      requires:
        - confirm
      deadline:
        min: 14
        max: 22
      traces:
        - kind: meeting
          roles:
            - courier
          place:
            query:
              - function:cafe
          evidences:
            - LOCATED_AT
            - MEETS_AT
          text: The pouch changes hands in a doorway and neither man stops walking.
        - kind: transmission
          channel: radio
          evidences:
            - LOCATED_AT
          text: The pouch is confirmed in the next pair of hands.
      onDisrupted: *a1
  stageCount:
    min: 2
    max: 6
  outcomes:
    success:
      - kind: arrest-role
        role: leader
      - kind: abort
    failure:
      - kind: stage-completed
        stage: finish
