# archetypes/role-variants.yaml — period variants of the slice role archetypes
# (content-expansion task 8.3; Req 6.2, 11.5).
#
# The slice `core` pack ships one occupied-Vienna cut of each generator role
# (cell, hostile-officer, station-staff, contact). These are alternate period
# variants of the same roles: different professional covers, personas and
# schedules so a generated world — or a second game in the same city — does not
# reuse the same handful of operatives. All are fictional.
#
# Each validates against ArchetypeSchema (packages/content/src/lib/kinds.ts).
# `allowedAllegiances` match the role exactly as the slice roster does: a cell
# role is only on the Cell, a hostile officer only on the Hostile Service,
# station staff only on the Station; a contact reads as neutral but may be a
# quiet Station friend (`[neutral, station]`). Each carries the matching
# `role:*` vocabulary Tag, MICE ranges, `wariness`, a Tag Query `schedule` over
# the core `function:*` vocabulary and a `fallback` Tag Query.
#
# personaPools/descriptorPools name the slice `core` pack's pools with explicit
# `core/...` namespacing (this pack ships none of its own).

# =========================================================================
# Cell — alternate members of the hostile network.
# =========================================================================

- id: lib-cell-quartermaster
  role: cell
  allowedAllegiances: [cell]
  tags: [role:cell]
  mice:
    money: { min: 0.3, max: 0.7 }
    ideology: { min: 0.4, max: 0.8 }
    coercion: { min: 0.1, max: 0.4 }
    ego: { min: 0.2, max: 0.5 }
  wariness: { min: 0.5, max: 0.8 }
  personaPools: [core/austrian, core/central-european]
  descriptorPools: [core/worker-clothes, core/street-clothes]
  schedule:
    - { weekday: monday, phase: night, at: [function:warehouse] }
    - { weekday: wednesday, phase: late-night, at: [function:safehouse] }
    - { weekday: saturday, phase: evening, at: [function:port] }
  fallback: [function:warehouse]
