# archetypes/civilians.yaml — the shared civilian roster (content-expansion
# task 8.3; Req 6.2, 11.5).
#
# At least 40 civilian archetypes drawn from the background life of an early-
# Cold-War European city: the trades, services and street people a generated
# city is populated with. Each is the template the World Generator stamps a
# Background NPC from (slice Req 29.1). Every character produced is fictional;
# no archetype represents a real historical individual.
#
# Each entry validates against ArchetypeSchema (packages/content/src/lib/
# kinds.ts): `role: civilian`, `allowedAllegiances: [neutral, unknown]` (a
# civilian reads as neutral, or unknown until the player establishes it), a
# `tags` list of at least one vocabulary Tag (every civilian carries
# `role:civilian`), MICE ranges, `wariness`, `personaPools`, `descriptorPools`,
# a Tag Query `schedule` and a `fallback` Tag Query.
#
# Schedules bind through the core `function:*` Tag Vocabulary (design, "Library
# content"): each slot's `at` resolves to the Instantiated City's Binders of
# that query, and `fallback` is used when a city binds none of a slot's `at`.
#
# personaPools/descriptorPools name the slice `core` pack's pools with explicit
# `core/...` namespacing (this pack ships none of its own). Persona pools:
# core/austrian, core/soviet, core/american, core/british, core/french,
# core/central-european. Descriptor pools: core/street-clothes,
# core/worker-clothes, core/waiter-dress, core/uniform-work-dress,
# core/office-dress, core/bourgeois-dress, core/smart-womens-dress,
# core/correspondent-dress, core/shabby-dress, core/occupation-dress,
# core/officer-bearing, core/professional-dress, core/service-uniform,
# core/winter-coat.

