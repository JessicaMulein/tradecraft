# culture-groups/french.yaml — the French group.
#
# A CultureGroup (CultureGroupSchema). French surnames are not gender-inflected,
# so family names are plain strings and the Naming Rule uses the generic
# {given} {family} display the engine renders. Quantity (Req 11.4): at least 100
# given and 100 family names, at least 300 distinct total. All names are
# generic, common French names of the period in fictional use; none names a real
# individual, and famous full-name combinations are avoided.
