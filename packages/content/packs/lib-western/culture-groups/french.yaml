  voiceTraits:
    - ironic and precise, fond of the well-placed shrug
    - debates for pleasure and concedes nothing early
    - laces warmth with a cool appraising eye
    - treats bureaucracy with weary contempt
    - softens a refusal with elaborate courtesy
  mannerisms:
    - punctuates a point with a lifted finger
    - lingers over coffee as if the meeting could wait
    - greets with a measured handshake and a half-step back
    - dismisses an idea with a slow exhale
    - keeps gloves on until the terms are agreed
  backgrounds:
    - text: Posted with the French occupation sector and quartered in the officers' mess.
      tags: []
      years: { from: 1945, to: 1955 }
    - text: Runs the local office of a Paris trading house and travels on its letterhead.
      tags: []
    - text: Teaches at the French lycée and keeps a careful list of the parents.
      tags: []
    - text: Came east as a journalist and files for a paper that pays in rumours.
      tags: []
    - text: Served in the Resistance and trusts almost no one with the whole of it.
      tags: []
      years: { from: 1945, to: 1960 }
    - text: Imports wine and perfume and knows which customs men take which favours.
      tags: []
    - text: Keeps the cultural institute's accounts and the attache's confidences.
      tags: []
    - text: Settled after the war to run a small hotel the right people pass through.
      tags: []
    - text: Represents an engineering firm bidding on the reconstruction contracts.
      tags: []
    - text: Married a local and now interprets for both families and neither fully.
      tags: []
    - text: Buys art for a Paris gallery and crosses the sectors with a dealer's ease.
      tags: []
    - text: Keeps the mission's cipher room and never speaks of the long nights.
      tags: []
    - text: Runs a brasserie near the station where the late trains bring strange company.
      tags: []
    - text: Advises on the currency talks and knows which rates were agreed in advance.
      tags: []
    - text: Came with the relief administration and stayed to run its warehouse.
      tags: []
      years: { from: 1945, to: 1955 }
    - text: Teaches fencing at a club the officers favour and hears the mess gossip.
      tags: []
