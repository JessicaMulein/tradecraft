  voiceTraits:
    - open and easy, quick to use a first name
    - sells optimism even when the facts are thin
    - name-drops a hometown and a ballclub to warm a room
    - talks fast, promises more than caution would allow
    - keeps a jovial surface over a careful listener
  mannerisms:
    - sticks out a hand before the introduction is finished
    - lights the other person's cigarette first
    - leans back and props an ankle on a knee
    - laughs a beat too long to buy a moment
    - checks a wristwatch as if the day were full
  backgrounds:
    - text: Came over with the occupation and stayed on with a trade mission.
