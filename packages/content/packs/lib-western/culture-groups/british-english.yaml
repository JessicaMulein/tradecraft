  voiceTraits:
    - dry, understated, deflecting praise with irony
    - precise in diction and sparing with warmth
    - treats enthusiasm as faintly bad form
    - lets class and school show in a careful vowel
    - closes a difficult subject with a wry aside
  mannerisms:
    - polishes spectacles while framing a reply
    - offers tea as a way of taking the measure of a guest
    - stands a touch too straight out of old habit
    - folds a newspaper to a quarter and reads it corner-first
    - clears the throat before any inconvenient truth
  backgrounds:
    - text: Attached to the control commission and billeted in a requisitioned house.
      tags: []
      years: { from: 1945, to: 1955 }
    - text: Represents a shipping line and keeps the manifests nobody else may see.
      tags: []
    - text: Lectures at the British institute and files quiet notes on who attends.
      tags: []
    - text: Served in intelligence in the war and never quite returned to civilian terms.
      tags: []
      years: { from: 1945, to: 1960 }
    - text: Manages a bank's local branch and knows which accounts move with the weather.
      tags: []
    - text: Reports for a London paper and cultivates every ministry doorman.
      tags: []
    - text: Trades in antiques and crosses borders with a dealer's easy paperwork.
      tags: []
    - text: Keeps a small import office going and asks no questions about the crates.
      tags: []
    - text: Came out with the diplomatic bag and stayed for reasons left unstated.
      tags: []
    - text: Teaches at a mission school and corrects more than grammar.
      tags: []
    - text: Keeps the registry at a consulate and the names that pass through it.
      tags: []
    - text: Buys tobacco for a London house and travels with a buyer's open door.
      tags: []
    - text: Edits the English page of a local daily and softens what the censor marks.
      tags: []
    - text: Ran a wartime liaison desk and kept the contacts long after the posting.
      tags: []
