# descriptor-fragments/clothing.yaml — the `clothing` slot.
#
# The largest slot: an early-Cold-War wardrobe (1945–1965) across the social
# register, from displaced-persons' remade coats to café-society tailoring.
# Each fragment validates against DescriptorFragmentSchema with `slot: clothing`.
#
# PERIOD. Where a garment belongs to only part of the Period Window it carries a
# `years` Year Range so the descriptor generator filters it by Game Year
# (Req 6.4):
#
#   * 1945–1952  — austerity and the ration years: army-surplus, remade and
#                  patched clothing, utility cut, make-do-and-mend.
#   * 1948–1965  — the New Look and the easing of rationing: fuller skirts,
#                  nipped waists, smarter postwar tailoring.
#   * 1958–1965  — the cleaner late-period cut: slimmer suits, shorter coats.
#
# Fragments with no `years` are period-neutral across the whole window (the
# plain suits, the loden coats, the working dress that changed little).
#
# GENDER. Garments that read as one gender carry `gender`; a double-breasted
# man's suit is `m`, a dirndl-blouse or a New Look costume `f`. Overcoats,
# raincoats and working overalls that either could wear carry no `gender`.
#
# CLIMATE. Winter and warm-weather dress is represented here, but no fragment
# carries a `climate` Tag — the vocabulary ships none yet (see pack.yaml). A
# fur-collared coat and a seersucker jacket both load; the generator leans on
# the city's climate for selection, and a later vocabulary task can tag them.
#
# A `text` that contains a comma is quoted so the YAML flow mapping does not
# read the comma as a key separator.

