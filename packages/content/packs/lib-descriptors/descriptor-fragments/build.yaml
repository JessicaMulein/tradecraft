# descriptor-fragments/build.yaml — the `build` slot.
#
# Physical build and carriage: the first line of a descriptor, the shape a
# watcher reads at a distance before any detail resolves. Build is
# gender-neutral and period-neutral, so no fragment carries `gender` or `years`.
# Each validates against DescriptorFragmentSchema with `slot: build`.
#
# A `text` that contains a comma is quoted so the YAML flow mapping does not
# read the comma as a key separator.
