# descriptor-fragments/carried.yaml — the `carried` slot.
#
# Something the subject is holding or carrying — the last line of a descriptor,
# a prop a watcher can follow through a crowd. Each fragment validates against
# DescriptorFragmentSchema with `slot: carried`.
#
# GENDER. A crocodile handbag or a wicker market basket read `f`; a furled
# umbrella and a leather document case suit either. A few gendered accessories
# carry `gender`; the rest do not. Carried items were period-stable, so none
# carries `years`. No `climate` Tag is attached (the vocabulary ships none —
# see pack.yaml).
#
# A `text` that contains a comma is quoted so the YAML flow mapping does not
# read the comma as a key separator.
