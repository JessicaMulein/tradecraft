# descriptor-fragments/headwear.yaml — the `headwear` slot.
#
# Hats, caps, headscarves and bare-headedness — the single most-noticed detail
# of a 1945–1965 silhouette, when nearly everyone wore something on the street.
# Each fragment validates against DescriptorFragmentSchema with `slot: headwear`.
#
# GENDER. A homburg or a flat cloth cap reads `m`; a small veiled hat or a
# headscarf knotted under the chin reads `f`. A felt trilby, a woollen muffler
# cap or a bare head suit either, and carry no `gender`.
#
# CLIMATE. Fur hats and summer straws both appear; no `climate` Tag is attached
# (the vocabulary ships none yet — see pack.yaml), so the generator leans on the
# city's climate to choose between them. A later vocabulary task can tag them.
#
# PERIOD. Hats were period-stable across the window; only the bare-headed
# younger look carries a late `years`, as going hatless spread toward the early
# 1960s.
#
# A `text` that contains a comma is quoted so the YAML flow mapping does not
# read the comma as a key separator.
