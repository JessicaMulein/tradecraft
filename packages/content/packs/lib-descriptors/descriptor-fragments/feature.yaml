# descriptor-fragments/feature.yaml — the `feature` slot.
#
# A distinguishing feature: the detail a watcher fixes on. This slot is
# deliberately the largest and most varied because the descriptor generator
# appends `feature` fragments one by one until a subject's descriptor is unique
# (Req 6.5; task 3.5) — a thin pool would force collisions. Each fragment
# validates against DescriptorFragmentSchema with `slot: feature`.
#
# GENDER. Facial hair reads `m` (a clipped moustache, a day's stubble); period
# cosmetics read `f` (pale powder and a dark lipstick, a marcel wave). The rest
# — complexion, bearing, hands, eyes, voice, gait — are gender-neutral and carry
# no `gender`. Nothing here is period-specific, so no fragment carries `years`.
#
# None of these describes a real individual. A `text` that contains a comma is
# quoted so the YAML flow mapping does not read the comma as a key separator.

# --- grooming: men ---------------------------------------------------------
- { id: feat-m-clean-shaven, slot: feature, gender: m, text: "clean-shaven, with a square jaw" }
- { id: feat-m-clipped-moustache, slot: feature, gender: m, text: a clipped moustache }
- { id: feat-m-pencil-moustache, slot: feature, gender: m, text: a pencil moustache }
- { id: feat-m-grey-stubble, slot: feature, gender: m, text: a day's grey stubble }
- { id: feat-m-spade-beard, slot: feature, gender: m, text: a neat spade beard }
- { id: feat-m-hair-oiled-flat, slot: feature, gender: m, text: hair oiled and combed flat }
- { id: feat-m-close-cropped, slot: feature, gender: m, text: hair close-cropped at the back and sides }
- { id: feat-m-thinning-swept, slot: feature, gender: m, text: thinning hair swept straight back }
- { id: feat-m-heavy-sideburns, slot: feature, gender: m, text: heavy sideburns }

