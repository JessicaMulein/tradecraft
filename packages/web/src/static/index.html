<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tradecraft</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to the game</a>
<header role="banner"><h1>Tradecraft</h1><div id="status" aria-live="off"></div>
<button id="mute" type="button" aria-pressed="false">Sound on</button></header>
<main id="main">
<section id="title" aria-label="Title">
<picture><source media="(min-width: 800px)" srcset="/art/box-wide.jpg"><img id="box" alt="Tradecraft box art" src="/art/box-square.jpg"></picture>
<form id="new-game"><label>Preset <select id="preset"><option>easy</option><option selected>standard</option><option>hard</option></select></label>
<label><input id="mole" type="checkbox"> Mole</label>
<button type="submit">Begin</button></form>
<p id="title-error" role="alert"></p>
</section>
<section id="game" hidden>
<div id="scene" aria-label="Scene"></div>
<p id="tutorial" hidden></p>
<div id="feed" role="log" aria-live="polite" aria-label="Story"></div>
<div id="params" hidden></div>
<ul id="actions" aria-label="Actions"></ul>
<nav id="views" aria-label="Aids"><button data-view="journal" type="button" title="Journal (j)">Journal</button><button data-view="map" type="button" title="Map (m)">Map</button><button data-view="city" type="button" title="City (y)">City</button><button data-view="stories" type="button" title="Stories (r)">Stories</button><button data-view="duties" type="button" title="Cover duties (k)">Duties</button><button data-view="people" type="button" title="People (p)">People</button><button data-view="documents" type="button" title="Documents (d)">Documents</button><button data-view="case" type="button" title="Case File (c)">Case File</button><button data-view="region" type="button" title="Region map (n)">Region</button><button data-view="departures" type="button" title="Departures (b)">Departures</button><button data-view="papers" type="button" title="Papers (a)">Papers</button><button data-view="carriage" type="button" title="Carriage (t)">Carriage</button><button data-view="street" type="button" title="Streets (g)">Streets</button><button data-view="intercepts" type="button" title="Intercepts (i)">Intercepts</button><button data-view="help" type="button" title="Help (?)">Help</button></nav>
<section id="aid" aria-live="polite" hidden></section>
<div id="doc-list" hidden></div>
<article id="reader" aria-label="Document" tabindex="-1" hidden><header><h2 id="reader-title"></h2><p id="reader-date" class="dim"></p><button id="reader-close" type="button">Close</button></header><div id="reader-body"></div></article>
<form id="say"><label>Say <input id="line" autocomplete="off"></label><button type="submit">Speak</button><button id="end-scene" type="button">End scene</button></form>
</section>
<div id="notices" role="status" aria-live="polite"></div>
</main>
<script type="module" src="/static/js/client/main.js"></script>
</body>
</html>
